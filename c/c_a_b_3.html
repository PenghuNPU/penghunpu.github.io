<style>
    .form-table { width: 100%; border-collapse: collapse; border: 2px solid #999; background-color: #fff; margin-bottom: 20px; }
    .form-table th { background-color: #f0f0f0; border: 1px solid #999; padding: 8px; text-align: center; vertical-align: middle; width: 60px; font-weight: normal; }
    .form-table td { border: 1px solid #999; padding: 8px; vertical-align: middle; }
    
    .form-title { background-color: #ffebee !important; font-weight: bold; text-align: center; font-size: 15px; padding: 10px !important; letter-spacing: 2px; }
    
    /* 天數分頁樣式 */
    .day-tabs { display: flex; border-bottom: 2px solid #ffaa44; margin-bottom: 10px; overflow-x: auto; padding-left: 5px; }
    .day-tab-btn { background-color: #d4d0c8; border: 1px solid #999; border-bottom: none; padding: 6px 15px; cursor: pointer; margin-right: 3px; border-radius: 4px 4px 0 0; font-size: 13px; }
    .day-tab-btn.active { background-color: #ffcc99; font-weight: bold; color: #900; padding-bottom: 7px; margin-bottom: -1px; }
    .day-tab-btn:hover:not(.active) { background-color: #e2dfd3; }
    
    .day-panel { display: none; }
    .day-panel.active { display: block; }
    
    .input-box { border: 1px inset #fff; padding: 3px; font-size: 13px; }
    .textarea-box { border: 1px inset #fff; padding: 4px; font-size: 13px; width: 98%; font-family: "細明體", sans-serif; resize: none; }
    .hint-text { color: #e65100; font-size: 11px; margin-top: 4px; display: inline-block; }
    
    .btn-query { background-color: #ffaa44 !important; color: #ffffff !important; font-weight: bold; border: 1px outset #fff !important; padding: 1px 6px; font-size: 12px; border-radius: 2px; cursor: pointer; margin: 0 4px; vertical-align: middle; }
    .btn-query:active { border-style: inset !important; }
    .btn-normal { background-color: #ece9d8; border: 1px outset #fff; padding: 2px 8px; cursor: pointer; font-size: 12px; vertical-align: middle; }
    .btn-normal:active { border-style: inset; }

    .req-icon { display: inline-block; width: 14px; height: 14px; background-color: #ffff00; color: #ff0000; border: 1px solid #808080; font-size: 12px; line-height: 14px; text-align: center; font-weight: bold; margin-left: 4px; vertical-align: middle; cursor: help; }
    
    .action-row { text-align: center; margin-top: 15px; padding: 10px; background-color: #808080; border: 1px solid #777; }
    .action-row button { background-color: #ece9d8; border: 2px outset #fff; padding: 4px 20px; font-weight: bold; letter-spacing: 2px; margin: 0 10px; cursor: pointer; }
    .action-row button:active { border-style: inset; }
    
    .upload-area { text-align: center; color: #0000ff; font-size: 12px; line-height: 1.8; }
    .preview-box { width: 145px; height: 112px; background-color: #d4d0c8; border: 2px inset #fff; margin: 0 auto 10px auto; display: flex; align-items: center; justify-content: center; color: #777; font-size: 12px; overflow: hidden; }
    .preview-box img { max-width: 100%; max-height: 100%; display: none; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.4); z-index: 999; }
    .modal-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #ece9d8; border: 2px solid #000; padding: 10px; width: 400px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
    .modal-header { background: linear-gradient(to right, #000080, #1084d0); color: white; padding: 4px; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 5px; }
    .modal-close { cursor: pointer; background: #d4d0c8; color: black; border: 1px outset #fff; padding: 0 4px; }
    .list-container { height: 250px; overflow-y: auto; background-color: white; border: 1px inset #fff; padding: 5px; }
    .list-item { padding: 6px; cursor: pointer; border-bottom: 1px dashed #ccc; display: flex; align-items: center; }
    .list-item:hover { background-color: #000080; color: white; }
    .hotel-code { font-weight: bold; color: #900; width: 50px; display: inline-block; margin-right: 10px; }
    .list-item:hover .hotel-code { color: #ffcc00; }
</style>

<table class="form-table" style="margin-bottom: 10px;">
    <tr>
        <td colspan="2" class="form-title">【 編輯行程內容 】</td>
    </tr>
    <tr style="background-color: #f0f0f0;">
        <th style="text-align:left; padding-left:10px; width:100px;">團型代碼</th>
        <td id="display_code" style="color: blue; font-weight: bold;">載入中...</td>
    </tr>
    <tr style="background-color: #f0f0f0;">
        <th style="text-align:left; padding-left:10px;">團型名稱</th>
        <td id="display_name" style="color: black;">載入中...</td>
    </tr>
</table>

<!-- 動態生成的天數頁籤 -->
<div id="day_tabs_container" class="day-tabs"></div>

<!-- 動態生成的每一天表單內容 -->
<div id="day_panels_container"></div>

<div class="action-row">
    <button onclick="window.saveTourItinerary()">確 定</button>
    <button onclick="if(typeof loadPage === 'function') loadPage('C-A-B');">放 棄</button>
</div>

<!-- 城市選擇器 -->
<div id="city_modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <span>選擇旅遊城市</span>
            <span class="modal-close" onclick="window.closeCityPicker()">X</span>
        </div>
        <div class="list-container" id="city_list"></div>
    </div>
</div>

<!-- 飯店選擇器 -->
<div id="hotel_modal" class="modal-overlay">
    <div class="modal-box" style="width: 450px;">
        <div class="modal-header">
            <span>選擇住宿飯店</span>
            <span class="modal-close" onclick="window.closeHotelPicker()">X</span>
        </div>
        <div class="list-container" id="hotel_list"></div>
    </div>
</div>

<script>
    // 變數初始化
    var currentPickerDay = 1;
    var totalTourDays = 1;

    var cityOptions = [
        "台北市", "新北市", "桃園市", "台中市", "台南市", "高雄市", "香港", "澳門", "北京",
        "東京 (Tokyo)", "大阪 (Osaka)", "京都 (Kyoto)", "札幌 (Sapporo)", "首爾 (Seoul)", "曼谷 (Bangkok)", "新加坡 (Singapore)", "巴黎 (Paris)"
    ];

    var hotelOptions = [
        { code: "MBS", name: "濱海灣金沙酒店 (Marina Bay Sands, Singapore)" },
        { code: "PHK", name: "半島酒店 (The Peninsula, Hong Kong)" },
        { code: "RCT", name: "麗茲卡爾頓酒店 (The Ritz-Carlton, Tokyo)" },
        { code: "RPA", name: "巴黎麗茲酒店 (Ritz Paris)" },
        { code: "TGH", name: "台北圓山大飯店 (The Grand Hotel, Taipei)" }
    ];

    // 🟢 切換天數分頁
    window.switchDayTab = function(dayNum) {
        document.querySelectorAll('.day-tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.day-panel').forEach(panel => panel.classList.remove('active'));
        
        var activeBtn = document.getElementById('tab_btn_' + dayNum);
        var activePanel = document.getElementById('panel_day_' + dayNum);
        
        if (activeBtn) activeBtn.classList.add('active');
        if (activePanel) activePanel.classList.add('active');
    };

    // 🟢 圖片預覽功能
    window.previewImageDay = function(event, dayNum) {
        var file = event.target.files[0];
        var preview = document.getElementById('image_preview_' + dayNum);
        var text = document.getElementById('preview_text_' + dayNum);

        if (file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                text.style.display = 'none';
            }
            reader.readAsDataURL(file);
        } else {
            preview.src = '';
            preview.style.display = 'none';
            text.style.display = 'block';
        }
    };

    // 🟢 Picker 彈跳視窗邏輯
    window.openCityPickerDay = function(dayNum) {
        currentPickerDay = dayNum;
        var html = '';
        cityOptions.forEach(function(city) {
            var safeCity = city.replace(/'/g, "\\'");
            html += '<div class="list-item" onclick="window.selectCity(\'' + safeCity + '\')">' + city + '</div>';
        });
        document.getElementById('city_list').innerHTML = html;
        document.getElementById('city_modal').style.display = 'block';
    };
    
    window.closeCityPicker = function() { document.getElementById('city_modal').style.display = 'none'; };
    
    window.selectCity = function(city) {
        document.getElementById('tour_city_' + currentPickerDay).value = city;
        window.closeCityPicker();
    };

    window.openHotelPickerDay = function(dayNum) {
        currentPickerDay = dayNum;
        var html = '';
        hotelOptions.forEach(function(h) {
            var safeCode = h.code.replace(/'/g, "\\'");
            var safeName = h.name.replace(/'/g, "\\'");
            var clickAction = "window.selectHotel('" + safeCode + "', '" + safeName + "')";
            html += '<div class="list-item" onclick="' + clickAction + '">' +
                        '<span class="hotel-code">[' + h.code + ']</span>' +
                        '<span>' + h.name + '</span>' +
                    '</div>';
        });
        document.getElementById('hotel_list').innerHTML = html;
        document.getElementById('hotel_modal').style.display = 'block';
    };
    
    window.closeHotelPicker = function() { document.getElementById('hotel_modal').style.display = 'none'; };
    
    window.selectHotel = function(code, name) {
        document.getElementById('hotel_code_' + currentPickerDay).value = code;
        document.getElementById('hotel_name_' + currentPickerDay).value = name;
        window.closeHotelPicker();
    };

    // 🟢 產生單一天數的表單 HTML
    window.createDayPanelHTML = function(dayNum, data) {
        var d = data || {};
        var cleanStr = function(val) { return (val === null || val === undefined) ? '' : val; };
        
        var name = cleanStr(d.trip_name);
        var city = cleanStr(d.tour_city);
        var hCode = cleanStr(d.hotel_code);
        var hSame = (d.hotel_same_level == 1) ? 'checked' : '';
        var hName = cleanStr(d.hotel_name);
        var mealF = cleanStr(d.meal_features);
        var bfChk = (d.bf_checked == null || d.bf_checked == 1) ? 'checked' : ''; // 預設打勾
        var bfDesc = cleanStr(d.bf_desc);
        var lunChk = (d.lun_checked == null || d.lun_checked == 1) ? 'checked' : '';
        var lunDesc = cleanStr(d.lun_desc);
        var dinChk = (d.din_checked == null || d.din_checked == 1) ? 'checked' : '';
        var dinDesc = cleanStr(d.din_desc);
        var content = cleanStr(d.itinerary_content);

        return `
        <div id="panel_day_${dayNum}" class="day-panel">
            <table class="form-table">
                <tr>
                    <th>第 ${dayNum} 天<br>標題</th>
                    <td>
                        <textarea id="trip_name_${dayNum}" class="textarea-box" rows="2" maxlength="80">${name}</textarea>
                        <span class="req-icon" title="必填">V</span>
                    </td>
                    <td rowspan="4" style="width: 250px; vertical-align: top; padding-top: 15px;">
                        <div class="upload-area">
                            請以瀏覽方式上傳圖檔<br>
                            檔案格式為jpg、jpeg或gif<br>
                            <div class="preview-box">
                                <span id="preview_text_${dayNum}">照片預覽區</span>
                                <img id="image_preview_${dayNum}" alt="預覽">
                            </div>
                            <input type="file" accept="image/jpeg, image/gif, image/png" style="width: 160px; font-size: 11px;" onchange="window.previewImageDay(event, ${dayNum})">
                        </div>
                    </td>
                </tr>
                <tr>
                    <th>旅遊<br>城市</th>
                    <td>
                        <input type="text" id="tour_city_${dayNum}" class="input-box" style="width: 200px; margin-bottom: 5px;" value="${city}">
                        <span class="req-icon" title="必填">V</span><br>
                        <button class="btn-query" type="button" onclick="window.openCityPickerDay(${dayNum})">?</button> <span class="hint-text" style="color: #d84315;">&lt;請從資料庫中選取&gt;</span>
                        <button class="btn-normal" type="button" style="margin-left: 10px;" onclick="document.getElementById('tour_city_${dayNum}').value=''">清除</button>
                    </td>
                </tr>
                <tr>
                    <th>住宿<br>飯店</th>
                    <td>
                        <div style="margin-bottom: 5px;">
                            <span style="color:#d84315; font-weight:bold;">飯店代碼：</span>
                            <input type="text" id="hotel_code_${dayNum}" class="input-box" style="width: 80px;" value="${hCode}">
                            <span class="req-icon" title="必填">V</span>
                            &nbsp;&nbsp;&nbsp;&nbsp;
                            <input type="checkbox" id="hotel_same_level_${dayNum}" ${hSame}> <span style="color:#d84315; font-weight:bold;">或同級</span>
                        </div>
                        <textarea id="hotel_name_${dayNum}" class="textarea-box" rows="2">${hName}</textarea>
                        <span class="req-icon" title="必填">V</span><br>
                        <button class="btn-query" type="button" onclick="window.openHotelPickerDay(${dayNum})">?</button> <span class="hint-text" style="color: #999;">&lt;請從資料庫選取，或直接輸入&gt;</span>
                        <button class="btn-normal" type="button" style="margin-left: 5px;" onclick="document.getElementById('hotel_code_${dayNum}').value=''; document.getElementById('hotel_name_${dayNum}').value='';">清除</button>
                    </td>
                </tr>
                <tr>
                    <th>餐食<br>特色</th>
                    <td colspan="2"><textarea id="meal_features_${dayNum}" class="textarea-box" rows="2" maxlength="80">${mealF}</textarea></td>
                </tr>
                <tr>
                    <th>餐食<br>安排</th>
                    <td colspan="2" style="line-height: 2;">
                        <span style="color:#d84315; font-weight:bold;">早餐：</span> <input type="checkbox" id="bf_chk_${dayNum}" ${bfChk}> &nbsp;
                        <span style="color:#d84315; font-weight:bold;">摘要：</span> <input type="text" id="bf_desc_${dayNum}" class="input-box" style="width: 200px;" maxlength="30" value="${bfDesc}"><br>
                        
                        <span style="color:#d84315; font-weight:bold;">午餐：</span> <input type="checkbox" id="lun_chk_${dayNum}" ${lunChk}> &nbsp;
                        <span style="color:#d84315; font-weight:bold;">摘要：</span> <input type="text" id="lun_desc_${dayNum}" class="input-box" style="width: 200px;" maxlength="30" value="${lunDesc}"><br>
                        
                        <span style="color:#d84315; font-weight:bold;">晚餐：</span> <input type="checkbox" id="din_chk_${dayNum}" ${dinChk}> &nbsp;
                        <span style="color:#d84315; font-weight:bold;">摘要：</span> <input type="text" id="din_desc_${dayNum}" class="input-box" style="width: 200px;" maxlength="30" value="${dinDesc}">
                    </td>
                </tr>
                <tr>
                    <th>行程<br>內容</th>
                    <td colspan="2">
                        <textarea id="itinerary_content_${dayNum}" class="textarea-box" rows="5">${content}</textarea>
                        <span class="req-icon" title="必填">V</span>
                    </td>
                </tr>
            </table>
        </div>
        `;
    };

    // 🟢 初始化載入邏輯
    window.initItinerary = function() {
        var tCode = window.currentEditTourCode || localStorage.getItem('editTourCode');
        var tName = window.currentEditTourName || localStorage.getItem('editTourName');

        if (!tCode || tCode === 'null') {
            alert("系統遺失團型代碼，請重新選擇！");
            if(typeof loadPage === 'function') loadPage('C-A-B');
            return;
        }

        document.getElementById('display_code').innerText = tCode;
        document.getElementById('display_name').innerText = tName || '';

        if (!window.db) return;

        // 1. 取得該團型的總天數
        try {
            var resDays = window.db.exec(`SELECT tour_days FROM BasicTours WHERE tour_code = '${tCode}'`);
            if (resDays.length > 0 && resDays[0].values.length > 0) {
                totalTourDays = parseInt(resDays[0].values[0][0]) || 1;
            }
        } catch(e) { console.error("無法取得天數，預設為1天", e); }

        // 2. 建立行程資料庫
        window.db.exec(`
            CREATE TABLE IF NOT EXISTS TourItinerary (
                tour_code TEXT, day_num INTEGER, trip_name TEXT, tour_city TEXT, hotel_code TEXT, hotel_same_level INTEGER, hotel_name TEXT,
                meal_features TEXT, bf_checked INTEGER, bf_desc TEXT, lun_checked INTEGER, lun_desc TEXT, din_checked INTEGER, din_desc TEXT, itinerary_content TEXT,
                PRIMARY KEY (tour_code, day_num)
            );
        `);

        // 3. 讀取現有行程資料
        var existingData = {};
        try {
            var res = window.db.exec(`SELECT * FROM TourItinerary WHERE tour_code = '${tCode}' ORDER BY day_num ASC`);
            if (res.length > 0) {
                res[0].values.forEach(row => {
                    var day = row[1];
                    existingData[day] = {
                        trip_name: row[2], tour_city: row[3], hotel_code: row[4], hotel_same_level: row[5], hotel_name: row[6],
                        meal_features: row[7], bf_checked: row[8], bf_desc: row[9], lun_checked: row[10], lun_desc: row[11], din_checked: row[12], din_desc: row[13], itinerary_content: row[14]
                    };
                });
            }
        } catch (e) { console.error("讀取行程資料失敗", e); }

        // 4. 動態產生 UI
        var tabsHtml = '';
        var panelsHtml = '';

        for (var i = 1; i <= totalTourDays; i++) {
            tabsHtml += `<div id="tab_btn_${i}" class="day-tab-btn" onclick="window.switchDayTab(${i})">第 ${i} 天</div>`;
            panelsHtml += window.createDayPanelHTML(i, existingData[i]);
        }

        document.getElementById('day_tabs_container').innerHTML = tabsHtml;
        document.getElementById('day_panels_container').innerHTML = panelsHtml;

        // 預設切換到第1天
        window.switchDayTab(1);
    };

    window.escapeSql = function(str) { return str ? str.replace(/'/g, "''") : ''; };

    // 🟢 儲存所有天數的行程
    window.saveTourItinerary = async function() {
        var tCode = window.currentEditTourCode || localStorage.getItem('editTourCode');
        if (!tCode || tCode === 'null') return;

        // 先刪除該團舊有的行程資料
        var sql = `DELETE FROM TourItinerary WHERE tour_code = '${tCode}'; \n`;

        for (var i = 1; i <= totalTourDays; i++) {
            var name = window.escapeSql(document.getElementById(`trip_name_${i}`).value.trim());
            var city = window.escapeSql(document.getElementById(`tour_city_${i}`).value.trim());
            var hCode = window.escapeSql(document.getElementById(`hotel_code_${i}`).value.trim());
            var hSame = document.getElementById(`hotel_same_level_${i}`).checked ? 1 : 0;
            var hName = window.escapeSql(document.getElementById(`hotel_name_${i}`).value.trim());
            
            var mFeat = window.escapeSql(document.getElementById(`meal_features_${i}`).value.trim());
            var bfChk = document.getElementById(`bf_chk_${i}`).checked ? 1 : 0;
            var bfDesc = window.escapeSql(document.getElementById(`bf_desc_${i}`).value.trim());
            var lunChk = document.getElementById(`lun_chk_${i}`).checked ? 1 : 0;
            var lunDesc = window.escapeSql(document.getElementById(`lun_desc_${i}`).value.trim());
            var dinChk = document.getElementById(`din_chk_${i}`).checked ? 1 : 0;
            var dinDesc = window.escapeSql(document.getElementById(`din_desc_${i}`).value.trim());
            
            var content = window.escapeSql(document.getElementById(`itinerary_content_${i}`).value.trim());

            // 簡單防呆：只要有填標題就存，否則若全空就跳過
            if (!name && !city && !content) continue;

            sql += `
                INSERT INTO TourItinerary (
                    tour_code, day_num, trip_name, tour_city, hotel_code, hotel_same_level, hotel_name,
                    meal_features, bf_checked, bf_desc, lun_checked, lun_desc, din_checked, din_desc, itinerary_content
                ) VALUES (
                    '${tCode}', ${i}, '${name}', '${city}', '${hCode}', ${hSame}, '${hName}',
                    '${mFeat}', ${bfChk}, '${bfDesc}', ${lunChk}, '${lunDesc}', ${dinChk}, '${dinDesc}', '${content}'
                );
            \n`;
        }

        if (window.executeAndSave) {
            try {
                var isSuccess = await window.executeAndSave(sql);
                if (isSuccess) alert("行程內容已成功儲存！");
            } catch(e) { alert("儲存失敗：" + e.message); }
        } else if (window.db) {
            window.db.exec(sql);
            alert("行程內容已成功儲存！");
        }
    };

    // 啟動初始化
    window.initItinerary();
</script>
