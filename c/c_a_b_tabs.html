<style>
    .page-wrapper { font-family: "MS Sans Serif", "細明體", sans-serif; font-size: 13px; padding: 15px; background-color: #ece9d8; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; }
    
    .tabs-nav { display: flex; border-bottom: 2px solid #999; margin-bottom: 0; padding-left: 10px; flex-shrink: 0; }
    .tab-btn { background-color: #d4d0c8; border: 1px solid #999; border-bottom: none; padding: 6px 20px; margin-right: 3px; cursor: pointer; border-radius: 5px 5px 0 0; font-weight: bold; color: #555; }
    .tab-btn.active { background-color: #fff; color: #000; border-top: 3px solid #ffaa44; }
    .tab-btn:hover:not(.active) { background-color: #e2dfd3; }
    
    .tab-content { flex-grow: 1; background-color: #fff; border: 1px solid #999; border-top: none; padding: 0; display: flex; flex-direction: column; }
    .tab-content iframe { width: 100%; height: 100%; border: none; flex-grow: 1; }
</style>

<div class="page-wrapper">
    <div class="tabs-nav">
        <!-- 點擊直接切換 iframe src -->
        <div class="tab-btn active" onclick="switchTab('c_a_b_1.html', this)">艙等機位數</div>
        <div class="tab-btn" onclick="switchTab('c_a_b_2.html', this)">航班資料</div>
        <div class="tab-btn" onclick="switchTab('c_a_b_3.html', this)">行程內容</div>
        <div class="tab-btn" onclick="switchTab('c_a_b_4.html', this)">各項費用表</div>
    </div>
    
    <div class="tab-content">
        <!-- 🟢 確保一開始就有畫面，不再依賴外部 JS 寫入 src -->
        <iframe id="sub_frame" src="c_a_b_1.html"></iframe>
    </div>
</div>

<script>
    // 單純用來切換頁籤，不再處理變數傳遞
    window.switchTab = function(pageName, element) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if(element) element.classList.add('active');
        document.getElementById('sub_frame').src = pageName;
    };
</script>
