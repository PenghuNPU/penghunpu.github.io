<style>
    .page-wrapper { font-family: "MS Sans Serif", "細明體", sans-serif; font-size: 13px; padding: 15px; background-color: #ece9d8; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; overflow-y: auto; }
    
    /* 頁籤導覽列樣式 */
    .tabs-nav { display: flex; border-bottom: 2px solid #999; margin-bottom: 0; padding-left: 10px; flex-shrink: 0; }
    .tab-btn { background-color: #d4d0c8; border: 1px solid #999; border-bottom: none; padding: 6px 20px; margin-right: 3px; cursor: pointer; border-radius: 5px 5px 0 0; font-weight: bold; color: #555; }
    .tab-btn.active { background-color: #fff; color: #000; border-top: 3px solid #ffaa44; }
    .tab-btn:hover:not(.active) { background-color: #e2dfd3; }
    
    /* 內容區塊 */
    .tab-content { flex-grow: 1; background-color: #fff; border: 1px solid #999; border-top: none; padding: 15px; }
    
    /* 頁籤內容隱藏控制 */
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* 以下為原 c_a_b_1.html 的樣式 */
    .form-table { width: 100%; border-collapse: collapse; border: 1px solid #777; margin-bottom: 15px; }
    .form-table th, .form-table td { border: 1px solid #777; padding: 6px; }
    .form-title { background-color: #ffcc99; font-weight: bold; text-align: center; font-size: 14px; padding: 8px !important; letter-spacing: 2px; }
    .info-header th { background-color: #f0f0f0; width: 100px; text-align: left; padding-left: 10px; }
    .info-header td { color: #333; font-weight: bold; color: blue; }
    .matrix-wrapper th { background-color: #f0f0f0; text-align: center; width: 100px; }
    .matrix-table { width: 100%; border-collapse: collapse; text-align: center; margin: 10px 0; }
    .matrix-table th { background-color: #ccccff; padding: 6px; border: none; border-bottom: 2px solid #fff; border-right: 2px solid #fff; }
    .matrix-table td { background-color: #ffffe0; padding: 6px; border: none; border-bottom: 2px solid #fff; border-right: 2px solid #fff; font-weight: bold;}
    .matrix-table tr.avail-row td { background-color: #ccccff; }
    .input-box { border: 1px inset #fff; padding: 3px; font-size: 13px; width: 40px; text-align: left; font-weight: normal; }
    .subtotal-box { border: 1px inset #fff; padding: 3px; font-size: 13px; width: 40px; text-align: left; background-color: #e0e0e0; font-weight: normal; cursor: default; }
    .action-row { text-align: center; margin-top: 15px; padding: 10px; background-color: #d4d0c8; border: 1px solid #777; }
    .action-row button { background-color: #ece9d8; border: 2px outset #fff; padding: 4px 20px; font-weight: bold; letter-spacing: 2px; margin: 0 10px; cursor: pointer; }
    .action-row button:active { border-style: inset; }
    
    .placeholder-box { padding: 20px; text-align: center; color: #555; line-height: 1.8; }
</style>

<div class="page-wrapper">
    <div class="tabs-nav">
        <!-- 點擊切換顯示的 Div (不再需要 iframe) -->
        <div class="tab-btn active" onclick="switchTab('tab_1', this)">艙等機位數</div>
        <div class="tab-btn" onclick="switchTab('tab_2', this)">航班資料</div>
        <div class="tab-btn" onclick="switchTab('tab_3', this)">行程內容</div>
        <div class="tab-btn" onclick="switchTab('tab_4', this)">各項費用表</div>
    </div>
    
    <div class="tab-content">
        
        <!-- ======================= 頁籤 1：艙等機位數 ======================= -->
        <div id="tab_1" class="tab-pane active">
            <table class="form-table">
                <tr>
                    <td colspan="2" class="form-title">【 編輯艙等機位數 】</td>
                </tr>
                <tr class="info-header">
                    <th>團型代碼</th>
                    <td id="display_code">資料讀取中...</td>
                </tr>
                <tr class="info-header">
                    <th>團型名稱</th>
                    <td id="display_name" style="color: black; font-weight: normal;">資料讀取中...</td>
                </tr>
                <tr class="matrix-wrapper">
                    <th>機位數</th>
                    <td style="padding: 0 20px;">
                        <table class="matrix-table">
                            <tr>
                                <th style="background-color: transparent;"></th>
                                <th>Y艙</th>
                                <th>ED艙</th>
                                <th>C艙</th>
                                <th>F艙</th>
                                <th style="color: red;">小計</th>
                            </tr>
                            <tr>
                                <td>各艙取得機位</td>
                                <td><input type="number" id="y_get" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="ed_get" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="c_get" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="f_get" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="text" id="sub_get" class="subtotal-box" readonly></td>
                            </tr>
                            <tr>
                                <td>領隊保留機位</td>
                                <td><input type="number" id="y_leader" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="ed_leader" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="c_leader" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="f_leader" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="text" id="sub_leader" class="subtotal-box" readonly></td>
                            </tr>
                            <tr>
                                <td>導遊保留機位</td>
                                <td><input type="number" id="y_guide" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="ed_guide" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="c_guide" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="f_guide" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="text" id="sub_guide" class="subtotal-box" readonly></td>
                            </tr>
                            <tr>
                                <td>其他保留機位</td>
                                <td><input type="number" id="y_other" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="ed_other" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="c_other" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="f_other" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="text" id="sub_other" class="subtotal-box" readonly></td>
                            </tr>
                            <tr>
                                <td>自由行保留機位</td>
                                <td><input type="number" id="y_fit" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="ed_fit" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="c_fit" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="number" id="f_fit" class="input-box" min="0" oninput="calcSeats()"></td>
                                <td><input type="text" id="sub_fit" class="subtotal-box" readonly></td>
                            </tr>
                            <tr class="avail-row">
                                <td>各艙可售機位</td>
                                <td id="y_avail">0</td>
                                <td id="ed_avail">0</td>
                                <td id="c_avail">0</td>
                                <td id="f_avail">0</td>
                                <td></td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        
            <div class="action-row">
                <button onclick="saveCabinSeats()">確 定</button>
                <button onclick="resetForm()">重 填</button>
                <!-- 呼叫主畫面的 loadPage 返回列表頁 -->
                <button onclick="if(typeof loadPage === 'function') loadPage('C-A-B'); else alert('無法返回主列表');">放 棄</button>
            </div>
        </div>
        
        <!-- ======================= 頁籤 2：航班資料 ======================= -->
        <div id="tab_2" class="tab-pane">
            <div class="form-title">【 編輯航班資料 】</div>
            <div class="placeholder-box">
                (航班資料開發中...)
            </div>
        </div>
        
        <!-- ======================= 頁籤 3：行程內容 ======================= -->
        <div id="tab_3" class="tab-pane">
            <div class="form-title">【 編輯行程內容 】</div>
            <div class="placeholder-box">
                (行程內容開發中...)
            </div>
        </div>
        
        <!-- ======================= 頁籤 4：各項費用表 ======================= -->
        <div id="tab_4" class="tab-pane">
            <div class="form-title">【 編輯各項費用表 】</div>
            <div class="placeholder-box">
                (各項費用表開發中...)
            </div>
        </div>

    </div>
</div>

<script>
    // === 頁籤切換邏輯 ===
    window.switchTab = function(tabId, element) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if(element) element.classList.add('active');
        
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
    };


    // === 資料與變數處理邏輯 ===
    
    // 從 localStorage 抓取變數
    let tourCode = localStorage.getItem('editTourCode') || '';
    let tourName = localStorage.getItem('editTourName') || '';

    window.calcSeats = function() {
        const types = ['y', 'ed', 'c', 'f'];
        const rows = ['get', 'leader', 'guide', 'other', 'fit'];

        rows.forEach(r => {
            let sum = 0;
            types.forEach(t => {
                let val = parseInt(document.getElementById(`${t}_${r}`).value) || 0;
                sum += val;
            });
            document.getElementById(`sub_${r}`).value = sum;
        });

        types.forEach(t => {
            let getVal = parseInt(document.getElementById(`${t}_get`).value) || 0;
            let leaderVal = parseInt(document.getElementById(`${t}_leader`).value) || 0;
            let guideVal = parseInt(document.getElementById(`${t}_guide`).value) || 0;
            let otherVal = parseInt(document.getElementById(`${t}_other`).value) || 0;
            let fitVal = parseInt(document.getElementById(`${t}_fit`).value) || 0;

            let avail = getVal - leaderVal - guideVal - otherVal - fitVal;
            document.getElementById(`${t}_avail`).innerText = avail;
        });
    };

    window.resetForm = function() {
        document.querySelectorAll('.input-box').forEach(input => input.value = '');
        calcSeats();
    };

    // 初始化載入
    (function init() {
        if (!tourCode) {
            alert("錯誤：未指定團型代碼！即將返回列表頁。");
            if(typeof loadPage === 'function') loadPage('C-A-B');
            return;
        }

        document.getElementById('display_code').innerText = tourCode;
        document.getElementById('display_name').innerText = tourName;

        if (!window.db) {
            console.warn("無法取得資料庫連線。");
            return;
        }

        window.db.exec(`
            CREATE TABLE IF NOT EXISTS TourCabinSeats (
                tour_code TEXT PRIMARY KEY,
                y_get INTEGER DEFAULT 0, y_leader INTEGER DEFAULT 0, y_guide INTEGER DEFAULT 0, y_other INTEGER DEFAULT 0, y_fit INTEGER DEFAULT 0,
                ed_get INTEGER DEFAULT 0, ed_leader INTEGER DEFAULT 0, ed_guide INTEGER DEFAULT 0, ed_other INTEGER DEFAULT 0, ed_fit INTEGER DEFAULT 0,
                c_get INTEGER DEFAULT 0, c_leader INTEGER DEFAULT 0, c_guide INTEGER DEFAULT 0, c_other INTEGER DEFAULT 0, c_fit INTEGER DEFAULT 0,
                f_get INTEGER DEFAULT 0, f_leader INTEGER DEFAULT 0, f_guide INTEGER DEFAULT 0, f_other INTEGER DEFAULT 0, f_fit INTEGER DEFAULT 0
            );
        `);

        try {
            const res = window.db.exec(`SELECT * FROM TourCabinSeats WHERE tour_code = '${tourCode}'`);
            if (res.length > 0) {
                const data = res[0].values[0];
                ['y', 'ed', 'c', 'f'].forEach((t, typeIdx) => {
                    ['get', 'leader', 'guide', 'other', 'fit'].forEach((r, rowIdx) => {
                        const val = data[1 + typeIdx * 5 + rowIdx];
                        document.getElementById(`${t}_${r}`).value = val === 0 ? '' : val;
                    });
                });
            }
        } catch (e) { console.error("載入機位資料失敗", e); }
        
        calcSeats();
    })();

    window.saveCabinSeats = async function() {
        if (!tourCode) { alert("無效的團型代碼，無法儲存！"); return; }
        
        const getVal = (id) => parseInt(document.getElementById(id).value) || 0;
        
        const sql = `
            INSERT INTO TourCabinSeats (
                tour_code,
                y_get, y_leader, y_guide, y_other, y_fit,
                ed_get, ed_leader, ed_guide, ed_other, ed_fit,
                c_get, c_leader, c_guide, c_other, c_fit,
                f_get, f_leader, f_guide, f_other, f_fit
            ) VALUES (
                '${tourCode}',
                ${getVal('y_get')}, ${getVal('y_leader')}, ${getVal('y_guide')}, ${getVal('y_other')}, ${getVal('y_fit')},
                ${getVal('ed_get')}, ${getVal('ed_leader')}, ${getVal('ed_guide')}, ${getVal('ed_other')}, ${getVal('ed_fit')},
                ${getVal('c_get')}, ${getVal('c_leader')}, ${getVal('c_guide')}, ${getVal('c_other')}, ${getVal('c_fit')},
                ${getVal('f_get')}, ${getVal('f_leader')}, ${getVal('f_guide')}, ${getVal('f_other')}, ${getVal('f_fit')}
            )
            ON CONFLICT(tour_code) DO UPDATE SET
                y_get=excluded.y_get, y_leader=excluded.y_leader, y_guide=excluded.y_guide, y_other=excluded.y_other, y_fit=excluded.y_fit,
                ed_get=excluded.ed_get, ed_leader=excluded.ed_leader, ed_guide=excluded.ed_guide, ed_other=excluded.ed_other, ed_fit=excluded.ed_fit,
                c_get=excluded.c_get, c_leader=excluded.c_leader, c_guide=excluded.c_guide, c_other=excluded.c_other, c_fit=excluded.c_fit,
                f_get=excluded.f_get, f_leader=excluded.f_leader, f_guide=excluded.f_guide, f_other=excluded.f_other, f_fit=excluded.f_fit;
        `;

        if (window.executeAndSave) {
            const isSuccess = await window.executeAndSave(sql);
            if (isSuccess) alert("機位資料已成功儲存！");
        } else if (window.db) {
            window.db.exec(sql);
            alert("機位資料已成功儲存！");
        } else {
            alert("資料庫錯誤，儲存失敗。");
        }
    };
</script>
