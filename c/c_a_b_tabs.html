<style>
    .tab-container { padding: 10px; background-color: #ece9d8; height: 100%; box-sizing: border-box; }
    .tabs-header { display: flex; border-bottom: 2px solid #fff; position: relative; }
    .tabs-header::after { content: ""; position: absolute; bottom: -2px; left: 0; right: 0; border-bottom: 1px solid #999; z-index: 1; }
    
    .tab-btn {
        padding: 6px 12px; border: 1px solid #999; border-bottom: none; background-color: #d6d3ce; margin-right: 2px; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 13px; position: relative; z-index: 0;
    }
    .tab-btn.active { background-color: #ece9d8; border-top: 3px solid #ffaa44; border-left: 1px solid #fff; font-weight: bold; z-index: 2; padding-bottom: 7px; margin-bottom: -1px; }
    .tab-btn:hover:not(.active) { background-color: #e2dfd3; }
    
    /* 🟢 關鍵修正：限制這個外框的高度，強制內容過長時產生右側專屬拉Bar */
    .tab-content-box { 
        border: 1px solid #999; 
        border-top: none; 
        border-right: 2px solid #fff; 
        border-bottom: 2px solid #fff; 
        background-color: #ece9d8; 
        padding: 15px; 
        
        /* 鎖定高度，扣除掉上方標題與標籤的高度 */
        height: calc(100vh - 160px); 
        min-height: 400px; 
        
        /* 內容超過高度時，自動顯示右側捲軸 */
        overflow-y: auto; 
    }
</style>

<div class="content-header" style="margin-bottom: 10px; font-size: 14px; font-weight: bold;">
    編輯團型基本資料 ▹ 團型代碼：<span id="header_tour_code" style="color: blue; margin-left:5px;"></span>
</div>

<div class="tab-container">
    <div class="tabs-header">
        <div class="tab-btn" onclick="window.switchTab(1, this)">1.艙等機位數</div>
        <div class="tab-btn" onclick="window.switchTab(2, this)">2.航班資料</div>
        <div class="tab-btn" onclick="window.switchTab(3, this)">3.行程內容</div>
        <div class="tab-btn" onclick="window.switchTab(4, this)">4.各項費用表</div>
    </div>

    <!-- 所有的分頁內容都會被限制在這個有拉 Bar 的框框內 -->
    <div id="sub-tab-content" class="tab-content-box">正在載入分頁內容...</div>
</div>

<script>
    // 檢查是否有傳遞 currentEditTourCode 過來
    if (!window.currentEditTourCode) {
        alert("⚠️ 系統遺失團型代碼，請重新從查詢清單點選！");
        if(typeof loadPage === 'function') loadPage('C-A-B');
    } else {
        document.getElementById('header_tour_code').innerText = window.currentEditTourCode;
    }

    // 🟢 關鍵修正：將 const 替換為 var，避免 SPA 架構下重複載入腳本引發語法錯誤而當機
    window.switchTab = function(tabIndex, element) {
        var tabs = document.querySelectorAll('.tabs-header .tab-btn');
        tabs.forEach(tab => tab.classList.remove('active'));
        if (element) element.classList.add('active');

        // 依照 a_a_a 的邏輯，這裡設定為 c/ 目錄。
        var subFilePath = `c/c_a_b_${tabIndex}.html`;
        var contentBox = document.getElementById('sub-tab-content');

        fetch(subFilePath)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                return response.text();
            })
            .then(html => {
                contentBox.innerHTML = html;
                var scripts = contentBox.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    var newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(error => {
                contentBox.innerHTML = `<div style="color:red; font-weight:bold; padding:20px;">⚠️ 無法載入檔案：${subFilePath} <br>原因：${error.message} <br>※請檢查檔案是否真的放在 c/ 資料夾下！</div>`;
                console.error("載入分頁失敗", error);
            });
    };

    // 預設載入第一個標籤
    setTimeout(() => {
        var targetTab = document.querySelector('.tabs-header .tab-btn:nth-child(1)');
        if (targetTab) window.switchTab(1, targetTab);
    }, 100);
</script>
