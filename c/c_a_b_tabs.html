<style>
    .page-wrapper { font-family: "MS Sans Serif", "細明體", sans-serif; font-size: 13px; padding: 15px; background-color: #ece9d8; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; }
    
    /* 頁籤導覽列樣式 */
    .tabs-nav { display: flex; border-bottom: 2px solid #999; margin-bottom: 0; padding-left: 10px; flex-shrink: 0; }
    .tab-btn { 
        background-color: #d4d0c8; 
        border: 1px solid #999; 
        border-bottom: none; 
        padding: 6px 20px; 
        margin-right: 3px; 
        cursor: pointer; 
        border-radius: 5px 5px 0 0; 
        font-weight: bold; 
        color: #555;
    }
    .tab-btn.active { 
        background-color: #fff; 
        color: #000; 
        border-top: 3px solid #ffaa44; 
    }
    .tab-btn:hover:not(.active) { background-color: #e2dfd3; }
    
    /* iframe 內容區塊 */
    .tab-content { 
        flex-grow: 1; 
        background-color: #fff; 
        border: 1px solid #999; 
        border-top: none; 
        padding: 0; 
        display: flex;
        flex-direction: column;
    }
    .tab-content iframe { width: 100%; height: 100%; border: none; flex-grow: 1; }
</style>

<div class="page-wrapper">
    <div class="tabs-nav">
        <!-- 點擊切換頁籤 -->
        <div class="tab-btn active" onclick="switchTab('c_a_b_1.html', this)">艙等機位數</div>
        <div class="tab-btn" onclick="switchTab('c_a_b_2.html', this)">航班資料</div>
        <div class="tab-btn" onclick="switchTab('c_a_b_3.html', this)">行程內容</div>
        <div class="tab-btn" onclick="switchTab('c_a_b_4.html', this)">各項費用表</div>
    </div>
    
    <div class="tab-content">
        <!-- 預設不寫死 src，由下方 JS 動態載入並帶上 URL 參數 -->
        <iframe id="sub_frame"></iframe>
    </div>
</div>

<script>
    // 初始化載入
    (function initTabs() {
        const code = window.currentEditTourCode || '';
        const name = window.currentEditTourName || '';
        
        if (!code) {
            alert("錯誤：未指定團型代碼！即將返回列表頁。");
            if(typeof loadPage === 'function') loadPage('C-A-B');
            return;
        }
        
        // 組合網址參數並載入第一頁
        const targetUrl = `c_a_b_1.html?code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`;
        document.getElementById('sub_frame').src = targetUrl;
    })();

    // 切換頁籤的函式
    window.switchTab = function(pageName, element) {
        // 更新按鈕樣式
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if(element) element.classList.add('active');
        
        // 抓取變數並附加在網址後方
        const code = window.currentEditTourCode || '';
        const name = window.currentEditTourName || '';
        const targetUrl = `${pageName}?code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`;
        
        // 切換 iframe 網址
        document.getElementById('sub_frame').src = targetUrl;
    };
</script>
