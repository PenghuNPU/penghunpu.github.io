<style>
    .page-wrapper { font-family: "MS Sans Serif", "細明體", sans-serif; font-size: 13px; padding: 15px; background-color: #ece9d8; height: 100%; box-sizing: border-box; overflow-y: auto; }
    .header-section { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: flex-start; }
    .info-text { color: #333; line-height: 1.6; text-align: left; flex-grow: 1; margin-left: 10px;}
    
    .btn-add { background-color: #d4d0c8; border: 2px outset #fff; cursor: pointer; display: flex; align-items: center; padding: 2px 10px; font-weight: bold; font-size: 13px; letter-spacing: 2px; height: 30px; }
    .btn-add:active { border-style: inset; }

    .pagination-bar { text-align: center; margin-bottom: 5px; font-size: 12px; }
    .pagination-bar a { text-decoration: none; color: black; margin: 0 5px; cursor: pointer; }
    .pagination-bar a:hover { text-decoration: underline; }
    
    .data-table { width: 100%; border-collapse: collapse; border: 1px solid #777; background-color: #fff; }
    .data-table th { background-color: #d4d0c8; border: 1px solid #777; padding: 6px; font-weight: bold; text-align: center; }
    .data-table td { border: 1px solid #777; padding: 6px; text-align: center; vertical-align: middle; }
    .data-table tr:nth-child(even) { background-color: #e2dfd3; }
    
    .action-icons span { cursor: pointer; margin: 0 4px; font-size: 15px; display: inline-block; }
    .action-icons span:hover { transform: scale(1.1); }
    
    .link-code { color: #0000ff; font-weight: bold; cursor: pointer; text-decoration: underline; }
    .link-code:hover { color: #ff0000; }
</style>

<div class="page-wrapper">
    <div class="header-section">
        <div class="info-text">
            點選團型代碼，可進一步編修基本團型資料。<br>
            P.S.一旦建立可隨時修改與刪除。
        </div>
        <!-- 🟢 呼叫獨立的新增 Function -->
        <button class="btn-add" onclick="window.openAddTour()">
            [+] 新 增
        </button>
    </div>

    <div class="pagination-bar">
        頁次：1 / 1 &nbsp;|&nbsp; 
        <a>第一頁</a> &nbsp;|&nbsp; <a>上一頁</a> &nbsp;|&nbsp; <a>下一頁</a> &nbsp;|&nbsp; <a>最後一頁</a> &nbsp;|&nbsp; 
        第 <input type="text" style="width:20px; border:1px solid #777; text-align:center;" value="1"> 頁 <button style="font-size:10px;">GO</button>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th style="width: 15%;">團型代碼</th>
                <th style="width: 30%;">團型名稱</th>
                <th style="width: 15%;">線別</th>
                <th style="width: 20%;">系列名稱</th>
                <th style="width: 5%;">天數</th>
                <th style="width: 15%;">管理項目</th>
            </tr>
        </thead>
        <tbody id="tour_list_body">
            <tr><td colspan="6">載入中...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // 🟢 建立與 AAA 相同的操作 Function
    window.openAddTour = function() {
        window.currentEditTourCode = null; 
        window.currentEditTourName = null;
        loadPage('C-A-B-ADD'); 
    };

    window.goToTourTabs = function(code, name) {
        window.currentEditTourCode = code;
        window.currentEditTourName = name;
        loadPage('C-A-B-TABS');
    };

    window.editTourBase = function(code, name) {
        window.currentEditTourCode = code;
        window.currentEditTourName = name;
        loadPage('C-A-B-ADD');
    };

    window.deleteTour = async function(code) {
        if(confirm(`警告：確定要刪除團型資料 [${code}] 嗎？此動作無法復原！`)) {
            const sql = `DELETE FROM BasicTours WHERE tour_code = '${code}';`;
            const isSuccess = await window.executeAndSave(sql);
            if(isSuccess) {
                alert("刪除成功！");
                window.loadTourList();
            }
        }
    };

    // 載入表格清單
    window.loadTourList = function() {
        if (!window.db) { alert("資料庫未綁定！"); return; }

        window.db.exec(`
            CREATE TABLE IF NOT EXISTS BasicTours (
                tour_code TEXT PRIMARY KEY CHECK(length(tour_code) <= 12), tour_category TEXT, line_name TEXT, series_name TEXT,
                tour_name TEXT NOT NULL CHECK(length(tour_name) <= 30), foreign_tour_no TEXT, product_name TEXT,
                tour_days INTEGER, tour_nights INTEGER, tour_area TEXT, tour_country TEXT, departure_airport TEXT,
                dev_features TEXT, itinerary_features TEXT, special_arrange TEXT, sales_features TEXT,
                ticket_desc TEXT, departure_notes TEXT, b2b_notes TEXT, included_items TEXT, excluded_items TEXT
            );
        `);

        try {
            const res = window.db.exec("SELECT tour_code, tour_name, line_name, series_name, tour_days FROM BasicTours ORDER BY tour_code ASC");
            const tbody = document.getElementById('tour_list_body');
            
            if (res.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="color:red; font-weight:bold;">目前尚無資料，請點擊右上角新增。</td></tr>`;
                return;
            }

            let html = '';
            res[0].values.forEach(row => {
                const code = row[0] || '';
                const name = row[1] || '';
                const line = row[2] || '';
                const series = row[3] || '';
                const days = row[4] || '0';
                const safeName = name.replace(/'/g, "\\'");

                html += `
                    <tr>
                        <td class="link-code" title="點擊進入分頁設定" onclick="window.goToTourTabs('${code}', '${safeName}')">
                            ${code}
                        </td>
                        <td style="text-align:left;">${name}</td>
                        <td>${line}</td>
                        <td>${series}</td>
                        <td>${days}</td>
                        <td class="action-icons">
                            <span title="修改基本資料" onclick="window.editTourBase('${code}', '${safeName}')">&#128221;</span>
                            <span title="刪除此筆資料" onclick="window.deleteTour('${code}')">&#10060;</span>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        } catch (e) {
            console.error(e);
            document.getElementById('tour_list_body').innerHTML = `<tr><td colspan="6">讀取失敗</td></tr>`;
        }
    };

    // 執行載入
    window.loadTourList();
</script>
