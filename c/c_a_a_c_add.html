<style>
    .page-wrapper { font-family: "MS Sans Serif", "細明體", sans-serif; font-size: 13px; padding: 15px; background-color: #ece9d8; height: 100%; box-sizing: border-box; overflow-y: auto; }
    
    .form-table { width: 100%; border-collapse: collapse; border: 2px solid #999; background-color: #fff; margin-bottom: 20px; }
    .form-table th { background-color: #f0f0f0; border: 1px solid #999; padding: 8px; text-align: center; vertical-align: middle; width: 40px; font-weight: normal; }
    .form-table td { border: 1px solid #999; padding: 8px; vertical-align: middle; }
    
    .form-title { background-color: #ffebee !important; font-weight: bold; text-align: center; font-size: 15px; padding: 10px !important; letter-spacing: 2px; }
    
    .input-box { border: 1px inset #fff; padding: 3px; font-size: 13px; }
    .textarea-box { border: 1px inset #fff; padding: 4px; font-size: 13px; width: 98%; font-family: "細明體", sans-serif; resize: none; }
    
    .hint-text { color: #e65100; font-size: 11px; margin-top: 4px; display: inline-block; }
    
    /* 查詢按鈕專屬樣式 (淺橘底、白字) */
    .btn-query {
        background-color: #ffaa44 !important; 
        color: #ffffff !important; 
        font-weight: bold;
        border: 1px outset #fff !important;
        padding: 1px 6px;
        font-size: 12px;
        border-radius: 2px;
        cursor: pointer;
        margin: 0 4px;
        vertical-align: middle;
    }
    .btn-query:active { border-style: inset !important; }
    
    .btn-normal { background-color: #ece9d8; border: 1px outset #fff; padding: 2px 8px; cursor: pointer; font-size: 12px; vertical-align: middle; }
    .btn-normal:active { border-style: inset; }

    /* 必填標記圖示樣式 */
    .req-icon {
        display: inline-block; width: 14px; height: 14px; background-color: #ffff00; color: #ff0000;
        border: 1px solid #808080; font-size: 12px; line-height: 14px; text-align: center;
        font-weight: bold; margin-left: 4px; vertical-align: middle; cursor: help;
    }
    
    .action-row { text-align: center; margin-top: 15px; }
    .action-row button { background-color: #d4d0c8; border: 2px outset #fff; padding: 4px 25px; font-weight: bold; letter-spacing: 5px; margin: 0 15px; cursor: pointer; }
    .action-row button:active { border-style: inset; }
    
    .upload-area { text-align: center; color: #0000ff; font-size: 12px; line-height: 1.8; }
</style>

<div class="page-wrapper">
    <table class="form-table">
        <tr>
            <!-- 標題會經由 JS 動態調整為「新增」或「修改」 -->
            <td colspan="3" class="form-title" id="form_title">【 新增共用基本行程內容 】</td>
        </tr>
        <tr>
            <th>行程<br>代碼</th>
            <td>
                <input type="text" id="trip_code" class="input-box" style="width: 150px; text-transform: uppercase;" maxlength="8">
                <span class="req-icon" title="必填">✓</span>
                <br><span class="hint-text">&lt;可使用英文加數字，長度以8個字為限&gt;</span>
            </td>
            <!-- 右側上傳圖片區塊 (跨 4 列) -->
            <td rowspan="4" style="width: 250px; vertical-align: bottom; padding-bottom: 20px;">
                <div class="upload-area">
                    請以瀏覽方式上傳圖檔<br>
                    檔案大小建議為30k以內<br>
                    檔案格式為jpg、jpeg或gif<br>
                    檔案寬度建議：145pixels<br>
                    高度建議：112pixels<br><br>
                    <input type="file" style="width: 160px; font-size: 11px;">
                </div>
            </td>
        </tr>
        <tr>
            <th>行程<br>名稱</th>
            <td>
                <textarea id="trip_name" class="textarea-box" rows="2" maxlength="80"></textarea>
                <span class="req-icon" title="必填">✓</span>
                <br><span class="hint-text">&lt;長度以80個字為限&gt;</span>
            </td>
        </tr>
        <tr>
            <th>旅遊<br>城市</th>
            <td>
                <select id="tour_city" class="input-box" style="width: 200px; margin-bottom: 5px;">
                    <option value="">-請選擇-</option>
                    <option value="香港">香港</option><option value="澳門">澳門</option><option value="東京">東京</option>
                </select>
                <span class="req-icon" title="必填">✓</span>
                <br>
                <button class="btn-query">📄?</button> <span class="hint-text" style="color: #d84315;">&lt;請從資料庫中選取&gt;</span>
                <button class="btn-normal" style="margin-left: 10px;">❌ 清除</button>
            </td>
        </tr>
        <tr>
            <th>住宿<br>飯店</th>
            <td>
                <div style="margin-bottom: 5px;">
                    <span style="color:#d84315; font-weight:bold;">飯店代碼：</span>
                    <input type="text" id="hotel_code" class="input-box" style="width: 80px;">
                    <span class="req-icon" title="必填">✓</span>
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="checkbox" id="hotel_same_level"> <span style="color:#d84315; font-weight:bold;">或同級</span>
                </div>
                <textarea id="hotel_name" class="textarea-box" rows="2"></textarea>
                <span class="req-icon" title="必填">✓</span>
                <br>
                <button class="btn-query">📄?</button> <span class="hint-text" style="color: #999;">&lt;請從資料庫選取飯店&gt;</span>
                <button class="btn-normal" style="margin-left: 5px;">✍手動輸入</button>
                <button class="btn-normal">❌ 清除</button>
            </td>
        </tr>
        
        <!-- 餐食與行程區塊 (跨兩欄) -->
        <tr>
            <th>餐食<br>特色</th>
            <td colspan="2">
                <textarea id="meal_features" class="textarea-box" rows="2" maxlength="80"></textarea>
                <br><span class="hint-text">&lt;長度以80個字為限&gt;</span>
            </td>
        </tr>
        <tr>
            <th>餐食<br>安排</th>
            <td colspan="2" style="line-height: 2;">
                <span style="color:#d84315; font-weight:bold;">早餐：</span> <input type="checkbox" id="bf_chk" checked> &nbsp;
                <span style="color:#d84315; font-weight:bold;">早餐摘要：</span> <input type="text" id="bf_desc" class="input-box" style="width: 250px;" maxlength="30"><br>
                
                <span style="color:#d84315; font-weight:bold;">午餐：</span> <input type="checkbox" id="lun_chk" checked> &nbsp;
                <span style="color:#d84315; font-weight:bold;">午餐摘要：</span> <input type="text" id="lun_desc" class="input-box" style="width: 250px;" maxlength="30"><br>
                
                <span style="color:#d84315; font-weight:bold;">晚餐：</span> <input type="checkbox" id="din_chk" checked> &nbsp;
                <span style="color:#d84315; font-weight:bold;">晚餐摘要：</span> <input type="text" id="din_desc" class="input-box" style="width: 250px;" maxlength="30">
                <span class="hint-text" style="margin-left: 10px;">&lt;各餐餐食摘要長度以30個字為限&gt;</span>
            </td>
        </tr>
        <tr>
            <th>行程<br>內容</th>
            <td colspan="2">
                <textarea id="itinerary_content" class="textarea-box" rows="5" style="margin-bottom: 5px;"></textarea>
                <span class="req-icon" title="必填">✓</span>
                <div style="text-align: center; margin-top: 5px;">
                    <button class="btn-normal" style="padding: 4px 15px; font-weight:bold; background-color:#d4d0c8;">使用編輯器</button>
                    <button class="btn-normal" style="padding: 4px 15px; font-weight:bold; background-color:#d4d0c8;">預覽畫面</button>
                </div>
            </td>
        </tr>
    </table>

    <div class="action-row">
        <button id="btn_save" onclick="saveItinerary()">新 增</button>
        <button onclick="loadPage('C-A-A-C')">放 棄</button>
    </div>
</div>

<script>
    // 初始化表單：判斷是否為修改模式
    (function initForm() {
        if (!window.db) return;
        
        if (window.currentEditTripCode) {
            document.getElementById('form_title').innerText = "【 修改共用基本行程內容 】";
            document.getElementById('btn_save').innerText = "修 改";
            
            const codeInput = document.getElementById('trip_code');
            codeInput.readOnly = true;
            codeInput.style.backgroundColor = '#e0e0e0';

            try {
                const res = window.db.exec(`SELECT * FROM CommonItineraries WHERE trip_code = '${window.currentEditTripCode}'`);
                if (res.length > 0) {
                    const data = res[0].values[0];
                    const cleanStr = (val) => val === null ? '' : val;

                    document.getElementById('trip_code').value = cleanStr(data[0]);
                    document.getElementById('trip_name').value = cleanStr(data[1]);
                    document.getElementById('tour_city').value = cleanStr(data[2]);
                    document.getElementById('hotel_code').value = cleanStr(data[3]);
                    document.getElementById('hotel_same_level').checked = (data[4] === 1);
                    document.getElementById('hotel_name').value = cleanStr(data[5]);
                    
                    document.getElementById('meal_features').value = cleanStr(data[6]);
                    document.getElementById('bf_chk').checked = (data[7] === 1);
                    document.getElementById('bf_desc').value = cleanStr(data[8]);
                    document.getElementById('lun_chk').checked = (data[9] === 1);
                    document.getElementById('lun_desc').value = cleanStr(data[10]);
                    document.getElementById('din_chk').checked = (data[11] === 1);
                    document.getElementById('din_desc').value = cleanStr(data[12]);
                    
                    document.getElementById('itinerary_content').value = cleanStr(data[13]);
                }
            } catch (e) {
                console.error("載入修改資料失敗", e);
            }
        }
    })();

    // 防止 SQL 隱碼與字串干擾的跳脫字元處理
    function escapeSql(str) {
        return str.replace(/'/g, "''");
    }

    window.saveItinerary = async function() {
        const code = document.getElementById('trip_code').value.trim().toUpperCase();
        const name = document.getElementById('trip_name').value.trim();
        const city = document.getElementById('tour_city').value.trim();
        const h_code = document.getElementById('hotel_code').value.trim();
        const h_same = document.getElementById('hotel_same_level').checked ? 1 : 0;
        const h_name = document.getElementById('hotel_name').value.trim();
        
        const m_feat = document.getElementById('meal_features').value.trim();
        const bf_chk = document.getElementById('bf_chk').checked ? 1 : 0;
        const bf_desc = document.getElementById('bf_desc').value.trim();
        const lun_chk = document.getElementById('lun_chk').checked ? 1 : 0;
        const lun_desc = document.getElementById('lun_desc').value.trim();
        const din_chk = document.getElementById('din_chk').checked ? 1 : 0;
        const din_desc = document.getElementById('din_desc').value.trim();
        
        const content = document.getElementById('itinerary_content').value.trim();

        // 必填驗證 (不包含餐食)
        if (!code) { alert("❌ 請填寫行程代碼！"); document.getElementById('trip_code').focus(); return; }
        if (!name) { alert("❌ 請填寫行程名稱！"); document.getElementById('trip_name').focus(); return; }
        if (!city) { alert("❌ 請選擇旅遊城市！"); document.getElementById('tour_city').focus(); return; }
        if (!h_code) { alert("❌ 請填寫飯店代碼！"); document.getElementById('hotel_code').focus(); return; }
        if (!h_name) { alert("❌ 請填寫住宿飯店！"); document.getElementById('hotel_name').focus(); return; }
        if (!content) { alert("❌ 請填寫行程內容！"); document.getElementById('itinerary_content').focus(); return; }

        let sql = "";

        if (window.currentEditTripCode) {
            // 修改 UPDATE
            sql = `
                UPDATE CommonItineraries SET 
                    trip_name = '${escapeSql(name)}', tour_city = '${escapeSql(city)}', hotel_code = '${escapeSql(h_code)}',
                    hotel_same_level = ${h_same}, hotel_name = '${escapeSql(h_name)}', meal_features = '${escapeSql(m_feat)}',
                    bf_checked = ${bf_chk}, bf_desc = '${escapeSql(bf_desc)}', lun_checked = ${lun_chk}, lun_desc = '${escapeSql(lun_desc)}',
                    din_checked = ${din_chk}, din_desc = '${escapeSql(din_desc)}', itinerary_content = '${escapeSql(content)}'
                WHERE trip_code = '${code}';
            `;
        } else {
            // 新增 INSERT - 檢查防呆
            const checkRes = window.db.exec(`SELECT trip_code FROM CommonItineraries WHERE trip_code = '${code}'`);
            if (checkRes.length > 0) {
                alert("❌ 錯誤：行程代碼不能重複！");
                document.getElementById('trip_code').focus();
                return;
            }
            sql = `
                INSERT INTO CommonItineraries (
                    trip_code, trip_name, tour_city, hotel_code, hotel_same_level, hotel_name,
                    meal_features, bf_checked, bf_desc, lun_checked, lun_desc, din_checked, din_desc, itinerary_content
                ) VALUES (
                    '${code}', '${escapeSql(name)}', '${escapeSql(city)}', '${escapeSql(h_code)}', ${h_same}, '${escapeSql(h_name)}',
                    '${escapeSql(m_feat)}', ${bf_chk}, '${escapeSql(bf_desc)}', ${lun_chk}, '${escapeSql(lun_desc)}', ${din_chk}, '${escapeSql(din_desc)}', '${escapeSql(content)}'
                );
            `;
        }

        const isSuccess = await window.executeAndSave(sql);
        if (isSuccess) {
            const actionText = window.currentEditTripCode ? "修改" : "新增";
            alert(`✅ 行程代碼 [${code}] 已成功${actionText}！`);
            loadPage('C-A-A-C'); // 返回列表頁
        }
    };
</script>
