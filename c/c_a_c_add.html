<style>
    .page-wrapper { font-family: "MS Sans Serif", "細明體", sans-serif; font-size: 13px; padding: 10px; background-color: #ece9d8; height: 100%; box-sizing: border-box; overflow-y: auto; }
    .info-header { font-size: 12px; margin-bottom: 10px; line-height: 1.6; }
    
    .form-table { width: 100%; border-collapse: collapse; border: 1px solid #777; background-color: #fff; margin-bottom: 15px; }
    .form-table th { background-color: #e2dfd3; border: 1px solid #777; padding: 6px; text-align: center; font-weight: normal; width: 130px; }
    .form-table td { border: 1px solid #777; padding: 6px; vertical-align: middle; }
    .form-title { background-color: #ffcc99; font-weight: bold; text-align: center; padding: 6px !important; letter-spacing: 2px; }
    
    .input-box { border: 1px inset #fff; padding: 2px 4px; font-size: 13px; }
    .highlight-text { color: red; }
    
    .action-row { text-align: center; margin-top: 15px; padding: 10px; background-color: #d4d0c8; border: 1px solid #777; }
    .action-row button { background-color: #ece9d8; border: 2px outset #fff; padding: 4px 20px; font-weight: bold; letter-spacing: 2px; margin: 0 10px; cursor: pointer; }
    .action-row button:active { border-style: inset; }

    /* 預覽與成功表格 */
    .list-table { width: 80%; border-collapse: collapse; border: 1px solid #777; background-color: #fff; margin: 10px auto; }
    .list-table th { background-color: #ffcc99; border: 1px solid #777; padding: 6px; text-align: center; }
    .list-table td { border: 1px solid #777; padding: 6px; text-align: center; }
    .info-box { border: 1px solid #999; background-color: #fff; padding: 15px; width: 80%; margin: 0 auto; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
</style>

<div class="page-wrapper">
    <div class="info-header" id="header_info">
        團型類別：<span id="lbl_cat"></span><br>
        系列代碼：<span id="lbl_series"></span> &nbsp;&nbsp; 系列名稱：<span id="lbl_sname"></span><br>
        團型代碼：<span id="lbl_code"></span> &nbsp;&nbsp; 團型名稱：<span id="lbl_name"></span>
    </div>

    <!-- 🟢 第一階段：輸入條件表單 -->
    <div id="step_form">
        <table class="form-table">
            <tr><td colspan="2" class="form-title">【請輸入個團相關條件】</td></tr>
            <tr>
                <th>基本團號</th>
                <td><input type="text" id="base_ind_code" class="input-box" style="width: 100px; text-transform:uppercase;"> (作為個團團號前綴)</td>
            </tr>
            <tr>
                <th>報名截止條件</th>
                <td>出國前 <input type="number" id="cutoff_days" class="input-box" style="width:40px; text-align:center;" value="2"> 天</td>
            </tr>
            <tr>
                <th>第一團出發日期</th>
                <td><input type="date" id="start_date" class="input-box"></td>
            </tr>
            <tr>
                <th>最後一團出發日期</th>
                <td><input type="date" id="end_date" class="input-box"></td>
            </tr>
            <tr>
                <th>出團週期</th>
                <td style="line-height: 2;">
                    <label><input type="radio" name="cycle" value="everyday" checked onchange="window.toggleDays(false)"> 天天出團</label><br>
                    <label><input type="radio" name="cycle" value="custom" onchange="window.toggleDays(true)"> 依下列週期規律性出發：</label><br>
                    <div id="weekday_options" style="opacity: 0.5; pointer-events: none; margin-left: 20px;">
                        <label><input type="checkbox" class="wk-chk" value="1"> 每週一</label>&nbsp;
                        <label><input type="checkbox" class="wk-chk" value="2"> 每週二</label>&nbsp;
                        <label><input type="checkbox" class="wk-chk" value="3"> 每週三</label>&nbsp;
                        <label><input type="checkbox" class="wk-chk" value="4"> 每週四</label><br>
                        <label><input type="checkbox" class="wk-chk" value="5"> 每週五</label>&nbsp;
                        <label><input type="checkbox" class="wk-chk" value="6"> 每週六</label>&nbsp;
                        <label><input type="checkbox" class="wk-chk" value="0"> 每週日</label>
                    </div>
                </td>
            </tr>
            <tr>
                <th>個團狀態</th>
                <td>
                    <label><input type="radio" name="status" value="開團" checked> 開團</label>
                    <label><input type="radio" name="status" value="準備"> 準備</label>
                </td>
            </tr>
        </table>
        <div class="action-row">
            <button onclick="window.generatePreview()">確 定</button>
            <button onclick="if(typeof loadPage === 'function') loadPage('C-A-C');">放 棄</button>
        </div>
    </div>

    <!-- 🟢 第二階段：預覽清單 -->
    <div id="step_preview" style="display: none;">
        <div class="info-box">
            <div style="font-weight:bold; text-align:center; font-size:14px; margin-bottom:10px;">【 確認個團團號 】</div>
            <div style="color:blue; font-size:12px; margin-bottom:10px;">
                本次將開出 <span id="preview_count" class="highlight-text">0</span> 團。請確認或修改下表中的「個團團號」，以免因團號重複而無法順利開團。<br>
                如欲刪除個團，請勾選右側刪除。
            </div>
            <table class="list-table">
                <thead>
                    <tr><th>序號</th><th>個團團號</th><th>出團日期</th><th>報名截止日期</th><th>刪除</th></tr>
                </thead>
                <tbody id="preview_tbody"></tbody>
            </table>
        </div>
        <div class="action-row">
            <button onclick="window.saveToDatabase(this)">確 定</button>
            <button onclick="if(typeof loadPage === 'function') loadPage('C-A-C');">放 棄</button>
        </div>
    </div>

    <!-- 🟢 第三階段：寫入成功畫面 -->
    <div id="step_success" style="display: none;">
        <div class="info-box">
            <div style="font-weight:bold; text-align:center; font-size:14px; margin-bottom:10px;">【 開團已完成 】</div>
            <div style="color:blue; font-size:12px; margin-bottom:10px;">
                本次共成功地開出 <span id="success_count" class="highlight-text">0</span> 團，下表為個團清單。
            </div>
            <table class="list-table">
                <thead>
                    <tr><th>序號</th><th>個團團號</th><th>出團日期</th><th>報名截止日期</th></tr>
                </thead>
                <tbody id="success_tbody"></tbody>
            </table>
        </div>
        <div class="action-row">
            <button onclick="if(typeof loadPage === 'function') loadPage('C-A-C');">回查詢清單</button>
        </div>
    </div>
</div>

<script>
    var globalToursData = []; // 暫存批次產生的個團資料

    window.toggleDays = function(enable) {
        var div = document.getElementById('weekday_options');
        div.style.opacity = enable ? '1' : '0.5';
        div.style.pointerEvents = enable ? 'auto' : 'none';
    };

    window.initOpenTour = function() {
        var code = localStorage.getItem('openTourCode') || '';
        if (!code) {
            alert("遺失團型資訊，請重新操作");
            if(typeof loadPage === 'function') loadPage('C-A-C');
            return;
        }
        document.getElementById('lbl_code').innerText = code;
        document.getElementById('lbl_name').innerText = localStorage.getItem('openTourName') || '';
        document.getElementById('lbl_cat').innerText = localStorage.getItem('openTourCategory') || '';
        document.getElementById('lbl_sname').innerText = localStorage.getItem('openTourSeries') || '';
        
        // 預設基本團號前綴
        document.getElementById('base_ind_code').value = code.substring(0, 5);

        // 確保個團資料庫存在
        if(window.db) {
            window.db.exec(`
                CREATE TABLE IF NOT EXISTS IndividualTours (
                    ind_tour_code TEXT PRIMARY KEY, tour_code TEXT NOT NULL, dep_date TEXT NOT NULL,
                    reg_cutoff_date TEXT, sales_targets TEXT, sales_category TEXT, tour_status TEXT,
                    web_sales INTEGER DEFAULT 0, deposit_required INTEGER, deposit_amount INTEGER, created_at DATETIME DEFAULT CURRENT_TIMESTAMP
                );
            `);
        }
    };

    // 格式化日期為 YYYY/MM/DD
    window.formatDate = function(dateObj) {
        var y = dateObj.getFullYear();
        var m = String(dateObj.getMonth() + 1);
        var d = String(dateObj.getDate());
        return `${y}/${m}/${d}`;
    };

    // 產生 YYYY/MM/DD(星期)
    window.formatDateWithDay = function(dateObj) {
        var days = ["日", "一", "二", "三", "四", "五", "六"];
        return `${window.formatDate(dateObj)}(${days[dateObj.getDay()]})`;
    };

    // 格式化為 YYMMDD (用於團號)
    window.formatShortDate = function(dateObj) {
        var y = String(dateObj.getFullYear()).slice(-2);
        var m = String(dateObj.getMonth() + 1).padStart(2, '0');
        var d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}${m}${d}`;
    };

    // 🟢 產生預覽清單
    window.generatePreview = function() {
        var baseCode = document.getElementById('base_ind_code').value.trim().toUpperCase();
        var startStr = document.getElementById('start_date').value;
        var endStr = document.getElementById('end_date').value;
        var cutoffDays = parseInt(document.getElementById('cutoff_days').value) || 0;
        
        if (!baseCode || !startStr || !endStr) {
            alert("基本團號、出發日期皆為必填！"); return;
        }

        var startDate = new Date(startStr);
        var endDate = new Date(endStr);
        if (startDate > endDate) { alert("第一團出發日不能晚於最後一團！"); return; }

        var isEveryday = document.querySelector('input[name="cycle"][value="everyday"]').checked;
        var allowedDays = [];
        if (!isEveryday) {
            document.querySelectorAll('.wk-chk:checked').forEach(cb => allowedDays.push(parseInt(cb.value)));
            if (allowedDays.length === 0) { alert("請至少勾選一個出團星期！"); return; }
        }

        globalToursData = [];
        var currentDate = new Date(startDate);
        
        while (currentDate <= endDate) {
            var dayOfWeek = currentDate.getDay();
            if (isEveryday || allowedDays.includes(dayOfWeek)) {
                
                var cutoffDate = new Date(currentDate);
                cutoffDate.setDate(cutoffDate.getDate() - cutoffDays);

                var generatedCode = `${baseCode}${window.formatShortDate(currentDate)}A`;
                
                globalToursData.push({
                    code: generatedCode,
                    dep_date: window.formatDateWithDay(currentDate),
                    cutoff_date: window.formatDateWithDay(cutoffDate),
                    dep_raw: window.formatDate(currentDate),
                    cutoff_raw: window.formatDate(cutoffDate)
                });
            }
            currentDate.setDate(currentDate.getDate() + 1); // 迴圈換下一天
        }

        if(globalToursData.length === 0) {
            alert("此日期區間內沒有符合週期的出發日！"); return;
        }

        // 渲染預覽表
        document.getElementById('preview_count').innerText = globalToursData.length;
        var html = '';
        globalToursData.forEach((tour, i) => {
            html += `
                <tr id="row_${i}">
                    <td>${i+1}</td>
                    <td><input type="text" class="input-box p_code" value="${tour.code}" style="width:120px;"></td>
                    <td style="color:#d84315;">${tour.dep_date}</td>
                    <td style="color:#d84315;">${tour.cutoff_date}</td>
                    <td><input type="checkbox" class="p_del" title="刪除此團"></td>
                </tr>
            `;
        });
        document.getElementById('preview_tbody').innerHTML = html;

        document.getElementById('step_form').style.display = 'none';
        document.getElementById('step_preview').style.display = 'block';
    };

    window.backToForm = function() {
        document.getElementById('step_preview').style.display = 'none';
        document.getElementById('step_form').style.display = 'block';
    };

    // 🟢 確定寫入資料庫
    window.saveToDatabase = async function(btnEl) {
        if(btnEl) { btnEl.disabled = true; btnEl.innerText = "寫入中..."; }

        var parentTourCode = localStorage.getItem('openTourCode');
        var status = document.querySelector('input[name="status"]:checked').value;
        
        var rows = document.querySelectorAll('#preview_tbody tr');
        var sqlList = [];
        var successData = [];

        for(var i=0; i<rows.length; i++) {
            var tr = rows[i];
            if(tr.querySelector('.p_del').checked) continue; // 若勾選刪除則跳過

            var code = window.escapeSql(tr.querySelector('.p_code').value.trim().toUpperCase());
            if(!code) continue;

            // 原始資料掛在 globalToursData 裡面對應的 index
            var ref = globalToursData[i];
            
            var sql = `
                REPLACE INTO IndividualTours (
                    ind_tour_code, tour_code, dep_date, reg_cutoff_date, tour_status
                ) VALUES (
                    '${code}', '${parentTourCode}', '${ref.dep_raw}', '${ref.cutoff_raw}', '${status}'
                );
            `;
            sqlList.push(sql);
            successData.push({ code: code, dep_date: ref.dep_date, cutoff_date: ref.cutoff_date });
        }

        if(sqlList.length === 0) {
            alert("沒有任何要開的團 (可能全部被刪除或留空)！");
            if(btnEl) { btnEl.disabled = false; btnEl.innerText = "確 定"; }
            return;
        }

        var finalSql = sqlList.join(" \n ");

        try {
            if (window.executeAndSave) {
                await window.executeAndSave(finalSql);
            } else if (window.db) {
                window.db.exec(finalSql);
            }
            
            // 寫入成功，渲染結果畫面
            document.getElementById('success_count').innerText = successData.length;
            var html = '';
            successData.forEach((t, i) => {
                html += `<tr><td>${i+1}</td><td>${t.code}</td><td style="color:#d84315;">${t.dep_date}</td><td style="color:#d84315;">${t.cutoff_date}</td></tr>`;
            });
            document.getElementById('success_tbody').innerHTML = html;

            document.getElementById('step_preview').style.display = 'none';
            document.getElementById('step_success').style.display = 'block';

        } catch(e) {
            alert("寫入資料庫失敗：" + e.message);
            if(btnEl) { btnEl.disabled = false; btnEl.innerText = "確 定"; }
        }
    };

    window.escapeSql = function(str) { return str ? str.replace(/'/g, "''").replace(/\r?\n/g, "\\n") : ''; };

    // 啟動
    window.initOpenTour();
</script>
