<style>
    .page-wrapper { font-family: "MS Sans Serif", "細明體", sans-serif; font-size: 13px; padding: 15px; background-color: #ece9d8; height: 100%; box-sizing: border-box; overflow-y: auto; }
    .header-section { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: flex-start; }
    .info-text { color: #333; line-height: 1.6; text-align: center; flex-grow: 1; }
    
    /* 自訂新增按鈕樣式 */
    .btn-add { background-color: #d4d0c8; border: 2px outset #fff; cursor: pointer; display: flex; align-items: center; padding: 2px 10px; font-weight: bold; font-size: 13px; letter-spacing: 2px; height: 30px; }
    .btn-add:active { border-style: inset; }
    .btn-add span.icon { font-size: 16px; margin-right: 5px; font-weight: normal; color: #555; }

    .pagination-bar { text-align: center; margin-bottom: 5px; font-size: 12px; }
    .pagination-bar a { text-decoration: none; color: black; margin: 0 5px; cursor: pointer; }
    .pagination-bar a:hover { text-decoration: underline; }
    
    .data-table { width: 100%; border-collapse: collapse; border: 1px solid #777; background-color: #fff; }
    .data-table th { background-color: #d4d0c8; border: 1px solid #777; padding: 6px; font-weight: bold; text-align: center; }
    .data-table td { border: 1px solid #777; padding: 6px; text-align: center; vertical-align: middle; }
    .data-table tr:nth-child(even) { background-color: #e2dfd3; } /* 斑馬紋 */
    
    .action-icons span { cursor: pointer; margin: 0 3px; font-size: 15px; }
    
    /* 複製按鈕禁用樣式 */
    .icon-disabled { cursor: default !important; opacity: 0.4; }
</style>

<div class="page-wrapper">
    <div class="header-section">
        <div style="width: 80px;"></div> <!-- 排版佔位 -->
        <div class="info-text">
            1、在此您可建立各系列之旅遊品牌名稱，此品牌名稱將使用於行程表及Hotel list上。<br>
            2、此處之公司聯絡人及電話，為各系列之國內聯絡或負責人，將顯示於Hotel list上。<br>
            P.S.一旦建立系列名稱，可修改但無法刪除。
        </div>
        <!-- 點擊跳轉至新增頁面，並確保清空修改狀態 -->
        <button class="btn-add" onclick="window.currentEditSeriesCode = null; loadPage('C-A-A-B-ADD')">
            <span class="icon">📝➕</span> 新 增
        </button>
    </div>

    <!-- 靜態分頁示意列 -->
    <div class="pagination-bar">
        頁次：1 / 1 &nbsp;|&nbsp; 
        <a>第一頁</a> &nbsp;|&nbsp; <a>上一頁</a> &nbsp;|&nbsp; <a>下一頁</a> &nbsp;|&nbsp; <a>最後一頁</a> &nbsp;|&nbsp; 
        第 <input type="text" style="width:20px; border:1px solid #777; text-align:center;" value="1"> 頁 <button style="font-size:10px;">GO</button>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th style="width: 10%;">代碼</th>
                <th style="width: 25%;">系列名稱</th>
                <th style="width: 15%;">所屬線別</th>
                <th style="width: 15%;">旅遊品牌</th>
                <th style="width: 10%;">公司聯絡人</th>
                <th style="width: 10%;">聯絡電話</th>
                <th style="width: 5%;">上架</th>
                <th style="width: 10%;">管理項目</th>
            </tr>
        </thead>
        <tbody id="series_list_body">
            <tr><td colspan="8">載入中...</td></tr>
        </tbody>
    </table>
</div>

<script>
    (function renderTable() {
        if (!window.db) { alert("資料庫未綁定！"); return; }
        
        window.db.exec(`
            CREATE TABLE IF NOT EXISTS ProductSeries (
                series_code TEXT PRIMARY KEY CHECK(length(series_code) <= 10),
                continent TEXT NOT NULL,
                line_name TEXT NOT NULL,
                series_name TEXT NOT NULL CHECK(length(series_name) <= 20),
                brand TEXT NOT NULL,
                contact_person TEXT NOT NULL,
                contact_phone TEXT NOT NULL,
                is_active INTEGER NOT NULL DEFAULT 1
            );
        `);

        try {
            const res = window.db.exec("SELECT series_code, series_name, line_name, brand, contact_person, contact_phone, is_active FROM ProductSeries ORDER BY series_code ASC");
            const tbody = document.getElementById('series_list_body');
            
            if (res.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="color:red; font-weight:bold;">目前尚無資料，請點擊右上角新增。</td></tr>`;
                return;
            }

            let html = '';
            res[0].values.forEach(row => {
                const code = row[0] || '';
                const name = row[1] || '';
                const line = row[2] || '';
                const brand = row[3] || '';
                const person = row[4] || '';
                const phone = row[5] || '';
                const isActive = row[6] === 1 ? 'checked' : '';

                html += `
                    <tr>
                        <td style="font-weight:bold; color:#0000ff;">${code}</td>
                        <td>${name}</td>
                        <td>${line}</td>
                        <td>${brand}</td>
                        <td>${person}</td>
                        <td>${phone}</td>
                        <td><input type="checkbox" disabled ${isActive}></td>
                        <td class="action-icons">
                            <!-- 點擊時傳遞對應的 record 代碼，並切換至新增/修改頁面 -->
                            <span title="修改此筆資料" onclick="window.currentEditSeriesCode = '${code}'; loadPage('C-A-A-B-ADD')">📝</span>
                            <!-- 複製功能只留圖示，無作用 -->
                            <span title="複製 (目前無作用)" class="icon-disabled">📄</span>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        } catch (e) {
            console.error(e);
            document.getElementById('series_list_body').innerHTML = `<tr><td colspan="8">讀取失敗</td></tr>`;
        }
    })();
</script>
