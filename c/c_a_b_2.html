<style>
    .form-table { width: 100%; border-collapse: collapse; border: 1px solid #777; margin-bottom: 15px; background-color: #fff; }
    .form-table th, .form-table td { border: 1px solid #777; padding: 4px 6px; vertical-align: middle; }
    
    /* 頂部標題區 */
    .top-header-area { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
    .btn-add { background-color: #d4d0c8; border: 2px outset #fff; cursor: pointer; padding: 2px 10px; font-weight: bold; margin-left: 15px; }
    .btn-add:active { border-style: inset; }
    
    /* 表格樣式對應圖片 */
    .title-green { background-color: #ccffcc; font-weight: bold; text-align: center; font-size: 14px; padding: 6px !important; letter-spacing: 2px; }
    .header-orange { background-color: #ffeebb; text-align: center; font-weight: normal; }
    
    .input-box { border: 1px inset #fff; padding: 2px 4px; font-size: 13px; }
    .input-center { text-align: center; }
    .btn-query { background-color: #ffaa44; color: #fff; font-weight: bold; border: 1px outset #fff; padding: 0 4px; font-size: 12px; cursor: pointer; vertical-align: middle; border-radius: 50%; }
    
    .action-row { text-align: center; margin-top: 15px; padding: 10px; background-color: #d4d0c8; border: 1px solid #777; }
    .action-row button { background-color: #ece9d8; border: 2px outset #fff; padding: 4px 20px; font-weight: bold; letter-spacing: 2px; margin: 0 10px; cursor: pointer; }
    .action-row button:active { border-style: inset; }

    /* 確保兩行一組的視覺一致性 */
    .flight-row-main td { border-bottom: none; text-align: center; background-color: #fff; }
    .flight-row-rmk td { border-top: none; background-color: #fff; padding-bottom: 8px;}

    /* 🟢 彈跳視窗 Modal 樣式 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.4); z-index: 999; }
    .modal-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #ece9d8; border: 2px solid #000; padding: 10px; width: 400px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
    .modal-header { background: linear-gradient(to right, #000080, #1084d0); color: white; padding: 4px; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 5px; }
    .modal-close { cursor: pointer; background: #d4d0c8; color: black; border: 1px outset #fff; padding: 0 4px; }
    .list-container { height: 250px; overflow-y: auto; background-color: white; border: 1px inset #fff; padding: 5px; }
    .list-item { padding: 6px; cursor: pointer; border-bottom: 1px dashed #ccc; display: flex; align-items: center; }
    .list-item:hover { background-color: #000080; color: white; }
    .airline-code { font-weight: bold; color: #900; width: 50px; display: inline-block; margin-right: 10px; }
    .list-item:hover .airline-code { color: #ffcc00; }
</style>

<div class="top-header-area">
    團型代碼：<span id="display_code" style="color:blue; font-weight:bold; margin-right:15px;">載入中...</span>
    團型名稱：<span id="display_name" style="color:black;">載入中...</span>
    <button class="btn-add" onclick="window.addFlightRow()">[+] 新 增</button>
</div>

<table class="form-table">
    <thead>
        <tr>
            <td colspan="9" class="title-green">【 修改航班資料 】</td>
        </tr>
        <tr class="header-orange">
            <th style="width: 60px;">天數</th>
            <th style="width: 50px;">組別</th>
            <th style="width: 50px;">人數</th>
            <th>班機號碼</th>
            <th style="width: 80px;">起飛時間</th>
            <th style="width: 80px;">抵達時間</th>
            <th>行程</th>
            <th style="width: 80px;">艙等</th>
            <th style="width: 40px;">刪除</th>
        </tr>
    </thead>
    <tbody id="flight_list_body">
        <!-- JS 動態插入航班資料 -->
    </tbody>
</table>

<div class="action-row">
    <button onclick="window.saveFlights()">確 定</button>
    <button onclick="if(typeof loadPage === 'function') loadPage('C-A-B');">放 棄</button>
</div>

<!-- 🟢 航空公司選擇器 Modal -->
<div id="airline_modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <span>選擇航空公司</span>
            <span class="modal-close" onclick="window.closeAirlinePicker()">X</span>
        </div>
        <div class="list-container" id="airline_list"></div>
    </div>
</div>

<script>
    // 🟢 台灣籍與常飛台灣航線之航空公司清單
    var airlineOptions = [
        { code: "CI", name: "中華航空 (China Airlines)" },
        { code: "BR", name: "長榮航空 (EVA Air)" },
        { code: "JX", name: "星宇航空 (STARLUX Airlines)" },
        { code: "IT", name: "台灣虎航 (Tigerair Taiwan)" },
        { code: "AE", name: "華信航空 (Mandarin Airlines)" },
        { code: "B7", name: "立榮航空 (UNI Air)" },
        { code: "CX", name: "國泰航空 (Cathay Pacific)" },
        { code: "UO", name: "香港快運航空 (HK Express)" },
        { code: "JL", name: "日本航空 (Japan Airlines)" },
        { code: "NH", name: "全日本空輸 (ANA)" },
        { code: "MM", name: "樂桃航空 (Peach Aviation)" },
        { code: "GK", name: "捷星日本航空 (Jetstar Japan)" },
        { code: "KE", name: "大韓航空 (Korean Air)" },
        { code: "OZ", name: "韓亞航空 (Asiana Airlines)" },
        { code: "7C", name: "濟州航空 (Jeju Air)" },
        { code: "SQ", name: "新加坡航空 (Singapore Airlines)" },
        { code: "TR", name: "酷航 (Scoot)" },
        { code: "TG", name: "泰國國際航空 (Thai Airways)" },
        { code: "VZ", name: "泰越捷航空 (Thai Vietjet Air)" },
        { code: "VN", name: "越南航空 (Vietnam Airlines)" },
        { code: "VJ", name: "越捷航空 (VietJet Air)" },
        { code: "PR", name: "菲律賓航空 (Philippine Airlines)" },
        { code: "5J", name: "宿霧太平洋航空 (Cebu Pacific)" },
        { code: "MH", name: "馬來西亞航空 (Malaysia Airlines)" },
        { code: "D7", name: "全亞洲航空 (AirAsia X)" },
        { code: "EK", name: "阿聯酋航空 (Emirates)" },
        { code: "UA", name: "聯合航空 (United Airlines)" },
        { code: "DL", name: "達美航空 (Delta Air Lines)" }
    ];

    // 全域變數：記錄當前點擊的是哪一列的航空輸入框
    var currentAirlineTargetInput = null;

    window.openAirlinePicker = function(btnElement) {
        // 透過 DOM 尋找被點擊按鈕旁邊的 .f_al 欄位
        currentAirlineTargetInput = btnElement.parentElement.querySelector('.f_al');
        
        var html = '';
        airlineOptions.forEach(function(al) {
            var safeCode = al.code.replace(/'/g, "\\'");
            var clickAction = "window.selectAirline('" + safeCode + "')";
            html += '<div class="list-item" onclick="' + clickAction + '">' +
                        '<span class="airline-code">[' + al.code + ']</span>' +
                        '<span>' + al.name + '</span>' +
                    '</div>';
        });
        document.getElementById('airline_list').innerHTML = html;
        document.getElementById('airline_modal').style.display = 'block';
    };

    window.closeAirlinePicker = function() { 
        document.getElementById('airline_modal').style.display = 'none'; 
    };

    window.selectAirline = function(code) {
        if (currentAirlineTargetInput) {
            currentAirlineTargetInput.value = code;
        }
        window.closeAirlinePicker();
    };

    // 產生單筆航班的 HTML 模板 (包含主檔列與備註列)
    window.createFlightRowHTML = function(data = {}) {
        var d = data || {};
        var day = d.day_num || '1';
        var grp = d.group_id || '01';
        var cap = d.capacity || '32';
        var al = d.airline_code || '';
        var fno = d.flight_no || '';
        var dep = d.dep_time || '';
        var arr = d.arr_time || '';
        var rFrom = d.route_from || '';
        var rTo = d.route_to || '';
        var cabin = d.cabin_class || 'Y艙';
        var rmk = d.remarks || '';

        var dayOptions = '';
        for(var i=1; i<=15; i++) {
            var sel = (i.toString() === day.toString()) ? 'selected' : '';
            dayOptions += `<option value="${i}" ${sel}>${i}</option>`;
        }

        var cabinOptions = ['Y艙', 'ED艙', 'C艙', 'F艙'].map(c => 
            `<option value="${c}" ${c === cabin ? 'selected' : ''}>${c}</option>`
        ).join('');

        return `
            <tr class="flight-row-main">
                <td><select class="input-box f_day">${dayOptions}</select></td>
                <td><input type="text" class="input-box input-center f_group" style="width:30px;" value="${grp}"></td>
                <td><input type="number" class="input-box input-center f_cap" style="width:40px;" value="${cap}"></td>
                <td>
                    <!-- 🟢 點擊 ? 時觸發航空選擇器，並將 this (按鈕本身) 傳入 -->
                    <button class="btn-query" type="button" onclick="window.openAirlinePicker(this)">?</button> 
                    <input type="text" class="input-box input-center f_al" style="width:35px; text-transform:uppercase;" value="${al}"> 
                    <input type="text" class="input-box f_no" style="width:45px;" value="${fno}">
                </td>
                <td><input type="text" class="input-box input-center f_dep" style="width:50px;" value="${dep}"></td>
                <td><input type="text" class="input-box input-center f_arr" style="width:50px;" value="${arr}"></td>
                <td>
                    <input type="text" class="input-box input-center f_from" style="width:40px; text-transform:uppercase;" value="${rFrom}"> / 
                    <input type="text" class="input-box input-center f_to" style="width:40px; text-transform:uppercase;" value="${rTo}">
                </td>
                <td><select class="input-box f_cabin">${cabinOptions}</select></td>
                <td><input type="checkbox" class="f_del" title="勾選後存檔即刪除"></td>
            </tr>
            <tr class="flight-row-rmk">
                <td colspan="9" style="text-align:left;">
                    &nbsp;&nbsp;訂位備註：<input type="text" class="input-box f_rmk" style="width:85%;" value="${rmk}">
                </td>
            </tr>
        `;
    };

    window.addFlightRow = function() {
        var tbody = document.getElementById('flight_list_body');
        tbody.insertAdjacentHTML('beforeend', window.createFlightRowHTML());
    };

    window.initFlights = function() {
        var tCode = window.currentEditTourCode;
        var tName = window.currentEditTourName;

        if (!tCode) {
            alert("系統遺失團型代碼，請重新選擇！");
            if(typeof loadPage === 'function') loadPage('C-A-B');
            return;
        }

        document.getElementById('display_code').innerText = tCode;
        document.getElementById('display_name').innerText = tName || '';

        if (!window.db) return;

        window.db.exec(`
            CREATE TABLE IF NOT EXISTS TourFlights (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                tour_code TEXT,
                day_num INTEGER,
                group_id TEXT,
                capacity INTEGER,
                airline_code TEXT,
                flight_no TEXT,
                dep_time TEXT,
                arr_time TEXT,
                route_from TEXT,
                route_to TEXT,
                cabin_class TEXT,
                remarks TEXT
            );
        `);

        var tbody = document.getElementById('flight_list_body');
        
        try {
            var res = window.db.exec(`SELECT * FROM TourFlights WHERE tour_code = '${tCode}' ORDER BY day_num ASC, id ASC`);
            if (res.length > 0 && res[0].values.length > 0) {
                var html = '';
                res[0].values.forEach(row => {
                    var data = {
                        day_num: row[2], group_id: row[3], capacity: row[4], airline_code: row[5],
                        flight_no: row[6], dep_time: row[7], arr_time: row[8],
                        route_from: row[9], route_to: row[10], cabin_class: row[11], remarks: row[12]
                    };
                    html += window.createFlightRowHTML(data);
                });
                tbody.innerHTML = html;
            } else {
                tbody.innerHTML = ''; 
            }
        } catch (e) { 
            console.error("載入航班失敗", e);
            tbody.innerHTML = '';
        }
    };

    window.saveFlights = async function() {
        var tCode = window.currentEditTourCode;
        if (!tCode) return;

        var tbody = document.getElementById('flight_list_body');
        var mainRows = tbody.querySelectorAll('.flight-row-main');
        var rmkRows = tbody.querySelectorAll('.flight-row-rmk');
        
        var sql = `DELETE FROM TourFlights WHERE tour_code = '${tCode}'; \n`;
        var hasData = false;

        for(var i=0; i<mainRows.length; i++) {
            var mainTr = mainRows[i];
            var rmkTr = rmkRows[i];
            
            var isDeleted = mainTr.querySelector('.f_del').checked;
            if (isDeleted) continue;

            var day = mainTr.querySelector('.f_day').value;
            var grp = window.escapeSql(mainTr.querySelector('.f_group').value.trim());
            var cap = parseInt(mainTr.querySelector('.f_cap').value) || 0;
            var al = window.escapeSql(mainTr.querySelector('.f_al').value.trim().toUpperCase());
            var fno = window.escapeSql(mainTr.querySelector('.f_no').value.trim());
            var dep = window.escapeSql(mainTr.querySelector('.f_dep').value.trim());
            var arr = window.escapeSql(mainTr.querySelector('.f_arr').value.trim());
            var rFrom = window.escapeSql(mainTr.querySelector('.f_from').value.trim().toUpperCase());
            var rTo = window.escapeSql(mainTr.querySelector('.f_to').value.trim().toUpperCase());
            var cabin = window.escapeSql(mainTr.querySelector('.f_cabin').value);
            var rmk = window.escapeSql(rmkTr.querySelector('.f_rmk').value.trim());

            if(!al && !fno && !rFrom && !rTo) continue;

            hasData = true;
            sql += `
                INSERT INTO TourFlights (
                    tour_code, day_num, group_id, capacity, airline_code, flight_no, 
                    dep_time, arr_time, route_from, route_to, cabin_class, remarks
                ) VALUES (
                    '${tCode}', ${day}, '${grp}', ${cap}, '${al}', '${fno}', 
                    '${dep}', '${arr}', '${rFrom}', '${rTo}', '${cabin}', '${rmk}'
                );
            \n`;
        }

        if (window.executeAndSave) {
            try {
                var isSuccess = await window.executeAndSave(sql);
                if (isSuccess) {
                    alert("航班資料已成功儲存！");
                    window.initFlights();
                }
            } catch (e) {
                alert("儲存失敗：" + e.message);
            }
        } else if (window.db) {
            try {
                window.db.exec(sql);
                alert("航班資料已成功儲存！");
                window.initFlights();
            } catch(e) { console.error(e); alert("儲存失敗"); }
        }
    };

    window.escapeSql = window.escapeSql || function(str) {
        return str ? str.replace(/'/g, "''") : '';
    };

    window.initFlights();
</script>
