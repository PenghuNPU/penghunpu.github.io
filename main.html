<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>旅行業資訊管理系統</title>
    <link rel="stylesheet" href="mainstyle.css">
    <script src="bulletin.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>
    <!-- 檔案選取遮罩 -->
    <div id="file-overlay">
        <div style="background-color: #fcf8f2; padding: 40px; border-radius: 15px; border: 3px solid #fb8c00; box-shadow: 0 10px 25px rgba(0,0,0,0.8); max-width: 600px; text-align: center; color: #333;">
            <h2 style="color: #e65100; margin-top: 0; border-bottom: 2px dashed #ffcc80; padding-bottom: 15px;">
                ⚠️ 歡迎進入系統！請先綁定資料庫
            </h2>
            <p style="font-size: 16px; font-weight: bold; color: #4e342e;">
                系統剛剛已自動下載了一份全新的資料庫至您的「下載」資料夾中。
            </p>
            <div style="background-color: #fffde7; border: 2px solid #fbc02d; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <p style="color: #d84315; font-size: 18px; margin: 0; font-weight: bold;">
                    👉 請點擊下方按鈕，選取剛剛下載的檔案：<br>
                    <span id="target-filename" style="font-size: 24px; color: #b71c1c; display: block; margin-top: 15px; background-color: #ffcdd2; padding: 10px; border-radius: 5px; border: 1px dashed #d32f2f;">
                        您的專屬檔案.sqlite
                    </span>
                </p>
            </div>
            <p style="font-size: 14px; color: #757575;">
                (綁定後，您在系統內的修改將會自動存檔，無須重複下載)
            </p>
            <button class="file-btn" onclick="openAndBindDatabase()" style="background-color: #ff9800; color: white; border: 2px solid #e65100; padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 8px; margin-top: 20px;">
                📁 選取 SQLite 檔案並進入系統
            </button>
        </div>
    </div>

    <div class="main-container">
        <!-- 左側導覽列 -->
        <div class="sidebar">
            <div class="login-info">
                <div class="login-time-bar">
                    登入時間：<span id="current-time"></span>
                </div>
                <!-- 檔案狀態顯示區塊 -->
                <div class="file-status-bar" style="position: relative;">
                    <span style="color: #2e7d32; font-weight:bold;">檔案狀態：</span>
                    <!-- 🟢 老師專屬的「切換檔案」按鈕，預設隱藏，由 JS 控制顯示 -->
                    <button id="btn-switch-db" onclick="switchStudentDatabase()" style="display: none; position: absolute; right: 5px; top: 2px; background-color: #ff9800; color: white; border: 1px solid #e65100; cursor: pointer; font-size: 11px; padding: 2px 5px; border-radius: 3px;">
                        📂 切換檔案
                    </button>
                    <br>
                    <span id="current-file" style="word-break: break-all; color:#d84315;">等待綁定...</span>
                </div>
                <div class="user-info-bar">
                    使用者：<span class="user-name">老師</span><br>
                    <span class="auth-template">管理員權限範本</span>
                </div>
            </div>
            <div class="logout-area">
                <button class="logout-btn" onclick="logout()">登 出</button>
            </div>
            <div class="menu-list" id="menu-list"></div>
        </div>

        <div class="content-area" id="content-area"></div>
    </div>

    <script src="mainscript.js"></script>
</body>
</html>
