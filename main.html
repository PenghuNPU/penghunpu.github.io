<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>旅行業資訊管理系統</title>
    <link rel="stylesheet" href="mainstyle.css">
    <script src="bulletin.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>
    <!-- 檔案選取遮罩 -->
    <div id="file-overlay">
        <div style="background-color: #fcf8f2; padding: 40px; border-radius: 15px; border: 3px solid #fb8c00; box-shadow: 0 10px 25px rgba(0,0,0,0.8); max-width: 600px; text-align: center; color: #333;">
            <h2 style="color: #e65100; margin-top: 0; border-bottom: 2px dashed #ffcc80; padding-bottom: 15px;">
                ⚠️ 歡迎進入系統！請先綁定資料庫
            </h2>
            <p style="font-size: 16px; font-weight: bold; color: #4e342e;">
                若您的電腦中尚無專屬資料庫，請點擊下方按鈕下載全新的空白資料庫；若已有檔案，請直接點擊開啟。
            </p>
            <div style="background-color: #fffde7; border: 2px solid #fbc02d; padding: 15px; border-radius: 8px; margin: 20px 0;">
                <p style="color: #d84315; font-size: 16px; margin: 0; font-weight: bold;">
                    資料庫檔名必須為：<br>
                    <span id="target-filename" style="font-size: 20px; color: #b71c1c; display: block; margin-top: 10px; background-color: #ffcdd2; padding: 8px; border-radius: 5px; border: 1px dashed #d32f2f;">
                        您的專屬檔案.sqlite
                    </span>
                </p>
            </div>
            
            <!-- 雙按鈕供使用者選擇 -->
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 20px;">
                <button class="file-btn" onclick="downloadBlankDatabaseInMain()" style="background-color: #0288d1; border: 2px solid #01579b; padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; color: white;">
                    📥 下載新的空白資料庫
                </button>
                <button class="file-btn" onclick="openAndBindDatabase()" style="background-color: #ff9800; border: 2px solid #e65100; padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; color: white;">
                    📁 開啟資料庫
                </button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- 左側導覽列 -->
        <div class="sidebar">
            <div class="login-info">
                <div class="login-time-bar">
                    登入時間：<span id="current-time"></span>
                </div>
                <!-- 檔案狀態顯示區塊 -->
                <div class="file-status-bar" style="position: relative;">
                    <span style="color: #2e7d32; font-weight:bold;">檔案狀態：</span>
                    <button id="btn-switch-db" onclick="switchStudentDatabase()" style="display: none; position: absolute; right: 5px; top: 2px; background-color: #ff9800; color: white; border: 1px solid #e65100; cursor: pointer; font-size: 11px; padding: 2px 5px; border-radius: 3px;">
                        📂 切換檔案
                    </button>
                    <br>
                    <span id="current-file" style="word-break: break-all; color:#d84315;">等待綁定...</span>
                </div>
                <div class="user-info-bar">
                    使用者：<span class="user-name">老師</span><br>
                    <span class="auth-template">管理員權限範本</span>
                </div>
            </div>
            <div class="logout-area">
                <button class="logout-btn" onclick="logout()">登 出</button>
            </div>
            <div class="menu-list" id="menu-list"></div>
        </div>

        <div class="content-area" id="content-area"></div>
    </div>

    <script src="mainscript.js"></script>
    <script>
        function downloadBlankDatabaseInMain() {
            const userAccount = localStorage.getItem("userAccount") || "0001";
            fetch('tourdata.sqlite')
                .then(response => {
                    if(!response.ok) throw new Error("找不到原始資料庫檔案");
                    return response.blob();
                })
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = userAccount + "tourdata.sqlite"; 
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    alert("✅ 空白資料庫已成功下載至您的電腦！請接著點擊「開啟資料庫」來選取它。");
                })
                .catch(err => {
                    console.error(err);
                    alert("❌ 下載空白資料庫失敗，請確認環境或直接點擊開啟資料庫。");
                });
        }
    </script>
</body>
</html>
