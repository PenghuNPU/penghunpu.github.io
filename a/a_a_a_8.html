<style>
    .detail-wrapper {
        border: 1px solid #777;
        background-color: #ece9d8;
        font-family: "MS Sans Serif", "細明體", sans-serif;
        font-size: 13px;
        padding: 10px;
        position: relative;
        min-height: 400px;
    }
    
    /* 🟢 分頁控制列樣式 */
    .pagination-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #d4d0c8;
        border: 1px solid #a0a0a0;
        padding: 4px 10px;
        font-weight: bold;
        margin-bottom: 0; /* 讓它與下方表格緊貼 */
    }
    .pagination-bar a {
        color: #000;
        text-decoration: none;
        cursor: pointer;
    }
    .pagination-bar a:hover {
        color: #0000ff;
        text-decoration: underline;
    }
    .page-input {
        width: 25px;
        border: 1px inset #fff;
        padding: 1px;
        text-align: center;
        height: 14px;
    }
    .btn-go {
        background-color: #ece9d8;
        border: 2px outset #fff;
        padding: 0 4px;
        cursor: pointer;
        font-size: 11px;
        height: 18px;
        line-height: 12px;
    }
    .btn-go:active { border-style: inset; }

    /* 🟢 紀錄表格樣式 */
    .record-table {
        width: 100%;
        border-collapse: collapse;
        background-color: #fff;
        border: 1px solid #a0a0a0;
        border-top: none; /* 與上方控制列融合 */
    }
    .record-table th {
        background-color: #d4d0c8;
        border: 1px solid #a0a0a0;
        padding: 4px 8px;
        font-weight: normal;
        text-align: center;
    }
    .record-table td {
        border: 1px solid #a0a0a0;
        padding: 4px 8px;
        text-align: center;
    }
    /* 摘要欄位靠左對齊 */
    .record-table td.summary-col {
        text-align: left;
    }
    /* 訂單編號底線連結樣式 */
    .order-link {
        color: #000;
        text-decoration: underline;
        cursor: pointer;
    }
    .order-link:hover {
        color: #0000ff;
    }
</style>

<div class="detail-wrapper">

<script>
