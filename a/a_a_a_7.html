<style>
    .detail-wrapper {
        border: 1px solid #777;
        background-color: #ece9d8;
        font-family: "MS Sans Serif", "細明體", sans-serif;
        font-size: 13px;
        padding: 10px;
        position: relative;
    }
    .detail-header {
        background: linear-gradient(to bottom, #d4d0c8, #b5b5b5);
        border: 1px outset #fff;
        text-align: center;
        font-weight: bold;
        padding: 4px;
        margin-bottom: 10px;
    }
    .detail-table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid #a0a0a0;
    }
    .detail-table td {
        padding: 8px 15px;
        vertical-align: middle;
        border-bottom: 1px solid #d4d0c8;
    }
    /* 斑馬紋灰底：設定偶數行為灰色以符合圖片 (卡號列為灰色) */
    .detail-table tr:nth-child(even) {
        background-color: #e2dfd3;
    }
    .input-box {
        border: 1px inset #fff;
        padding: 3px 4px;
        background-color: #fff;
    }
    .date-box { width: 30px; text-align: center; }
    .date-box.year { width: 45px; }
    
    .btn {
        background-color: #ece9d8; border: 1px outset #fff; padding: 1px 6px; cursor: pointer; font-size: 12px;
    }
    .btn:active { border-style: inset; }

    /* 🟢 新增：查詢按鈕專屬樣式 (淺橘底、白字) */
    .btn-query {
        background-color: #ffaa44; /* 淺橘色 */
        color: #ffffff; /* 白色 */
        font-weight: bold;
    }
    
    .action-row {
        background-color: #808080; 
        text-align: center; 
        padding: 8px; 
        margin-top: 15px;
    }
    .action-row button {
        background-color: #d4d0c8; 
        border: 2px outset #fff; 
        padding: 3px 20px; 
        font-weight: bold; 
        letter-spacing: 3px; 
        margin: 0 5px; 
        cursor: pointer;
    }
    .action-row button:active { 
        border-style: inset; 
    }
    /* 隱藏原生日期選擇器 */
    .hidden-date-picker { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; border: none; }
</style>

<div class="detail-wrapper">
    <div class="detail-header">
        【旅客編號：<span id="m_customer_id" style="color: blue;">載入中...</span>】
    </div>

    <table class="detail-table">
        <tr>
            <td style="width: 150px; font-weight: bold;">會員卡名稱：</td>
            <td>
                <input type="text" id="card_name" class="input-box" style="width: 250px;">
                <!-- 🟢 修改：套用淺橘色與白色問號 -->
                <button class="btn btn-query">📄?</button>
            </td>
        </tr>
        <tr>
            <td style="font-weight: bold;">卡號：</td>
            <td>
                <input type="text" id="card_number" class="input-box" style="width: 180px;">
            </td>
        </tr>
        <tr>
            <td style="font-weight: bold;">效期：</td>
            <td>
                <input type="text" id="expiry_y" class="input-box date-box year"> 年
                <input type="text" id="expiry_m" class="input-box date-box"> 月
                <input type="text" id="expiry_d" class="input-box date-box"> 日
                <button class="btn" onclick="window.openSplitDate('expiry')">📅</button>
                <input type="date" id="picker_expiry" class="hidden-date-picker" onchange="window.fillSplitDate('expiry')">
            </td>
        </tr>
    </table>

    <div class="action-row">
        <button onclick="window.saveMemberInfo()">更 新</button>
        <button onclick="loadPage('A-A-A')">放 棄</button>
    </div>
</div>

<script>
    // 🟢 初始化載入：讀取該旅客的會員資料
    (function initMemberInfo() {
        const c_id = window.currentCustomerId; 
        if(!c_id) {
            alert("系統遺失旅客編號，請重新選擇！");
            loadPage('A-A-A');
            return;
        }
        document.getElementById('m_customer_id').innerText = c_id;

        // 防呆建立資料表
        window.db.exec(`
            CREATE TABLE IF NOT EXISTS CustomerMember (
                customer_id TEXT UNIQUE CHECK(length(customer_id) = 7),
                card_name TEXT,
                card_number TEXT,
                expiry_y TEXT,
                expiry_m TEXT,
                expiry_d TEXT
            );
        `);

        // 讀取資料庫
        const query = `
            SELECT card_name, card_number, expiry_y, expiry_m, expiry_d
            FROM CustomerMember WHERE customer_id = '${c_id}'
        `;

        try {
            const res = window.db.exec(query);
            if (res.length > 0) {
                const data = res[0].values[0];
                const cleanStr = (val) => (val === null || val === 'null' || val === undefined) ? '' : val;

                document.getElementById('card_name').value = cleanStr(data[0]);
                document.getElementById('card_number').value = cleanStr(data[1]);
                document.getElementById('expiry_y').value = cleanStr(data[2]);
                document.getElementById('expiry_m').value = cleanStr(data[3]);
                document.getElementById('expiry_d').value = cleanStr(data[4]);
            }
        } catch (e) {
            console.error("讀取旅客會員資料錯誤：", e);
        }
    })();

    // 🟢 日期選擇器功能：拆分為 年、月、日 三個欄位
    window.openSplitDate = function(prefix) { 
        document.getElementById(`picker_${prefix}`).showPicker(); 
    };

    window.fillSplitDate = function(prefix) {
        const dateValue = document.getElementById(`picker_${prefix}`).value;
        if (dateValue) {
            const parts = dateValue.split('-'); // 將 "2024-05-18" 拆成 ["2024", "05", "18"]
            document.getElementById(`${prefix}_y`).value = parts[0];
            document.getElementById(`${prefix}_m`).value = parts[1];
            document.getElementById(`${prefix}_d`).value = parts[2];
        }
    };

    // 🟢 儲存資料
    window.saveMemberInfo = async function() {
        const c_id = window.currentCustomerId; 
        if(!c_id) {
            alert("找不到旅客編號，無法儲存！");
            return;
        }
        
        const card_name = document.getElementById('card_name').value;
        const card_number = document.getElementById('card_number').value;
        const expiry_y = document.getElementById('expiry_y').value;
        const expiry_m = document.getElementById('expiry_m').value;
        const expiry_d = document.getElementById('expiry_d').value;

        const sql = `
            REPLACE INTO CustomerMember (
                customer_id, card_name, card_number, expiry_y, expiry_m, expiry_d
            ) VALUES (
                '${c_id}', '${card_name}', '${card_number}', '${expiry_y}', '${expiry_m}', '${expiry_d}'
            );
        `;

        const isSuccess = await window.executeAndSave(sql);
        if (isSuccess) {
            alert(`✅ 旅客 [${c_id}] 的「會員資料」已成功更新！`);
        }
    };
</script>
