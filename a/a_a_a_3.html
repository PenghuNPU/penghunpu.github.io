<style>
    .detail-wrapper {
        border: 1px solid #777;
        background-color: #ece9d8;
        font-family: "MS Sans Serif", "細明體", sans-serif;
        font-size: 13px;
        padding: 10px;
        position: relative;
    }
    .detail-header {
        background: linear-gradient(to bottom, #d4d0c8, #b5b5b5);
        border: 1px outset #fff;
        text-align: center;
        font-weight: bold;
        padding: 4px;
        margin-bottom: 10px;
    }
    .detail-table {
        width: 100%;
        border-collapse: collapse;
    }
    .detail-table td {
        padding: 6px 10px;
        vertical-align: middle;
        border-bottom: 1px solid #d4d0c8;
    }
    /* 讓奇數行有微微的灰底，還原圖片斑馬紋質感 */
    .detail-table tr:nth-child(odd) {
        background-color: #e2dfd3;
    }
    .input-box {
        border: 1px inset #fff;
        padding: 2px 4px;
        background-color: #fff;
    }
    .btn {
        background-color: #ece9d8; border: 1px outset #fff; padding: 1px 6px; cursor: pointer; font-size: 12px;
    }
    .btn:active { border-style: inset; }
    .action-row {
        background-color: #808080; text-align: center; padding: 8px; margin-top: 15px;
    }
    .action-row button {
        background-color: #d4d0c8; border: 2px outset #fff; padding: 3px 20px; font-weight: bold; letter-spacing: 3px; margin: 0 5px; cursor: pointer;
    }
    .action-row button:active { border-style: inset; }
    
    /* 隱藏原生日期選擇器 (預留給未來擴充用) */
    .hidden-date-picker { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; border: none; }
</style>

<div class="detail-wrapper">
    <div class="detail-header">
        【旅客編號：<span id="e_customer_id" style="color: blue;">載入中...</span>】
    </div>

    <table class="detail-table">
        <tr>
            <td style="width: 25%; font-weight: bold;">Nationality :</td>
            <td><input type="text" id="nationality_e" class="input-box" style="width: 150px;"></td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Place of Birth :</td>
            <td><input type="text" id="place_of_birth_e" class="input-box" style="width: 150px;"></td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Occupation :</td>
            <td><input type="text" id="occupation_e" class="input-box" style="width: 150px;"></td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Company Name :</td>
            <td><input type="text" id="company_name_e" class="input-box" style="width: 350px;"></td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Position :</td>
            <td><input type="text" id="position_e" class="input-box" style="width: 150px;"></td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Name of Boss :</td>
            <td><input type="text" id="name_of_boss_e" class="input-box" style="width: 150px;"></td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Color of Eyes :</td>
            <td><input type="text" id="color_of_eyes_e" class="input-box" style="width: 100px;"></td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Hair :</td>
            <td><input type="text" id="hair_e" class="input-box" style="width: 100px;"></td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Face :</td>
            <td><input type="text" id="face_e" class="input-box" style="width: 100px;"></td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Marks of Iden :</td>
            <td><input type="text" id="marks_of_iden_e" class="input-box" style="width: 250px;"></td>
        </tr>
    </table>

    <div class="action-row">
        <button onclick="window.saveEnglishInfo()">更 新</button>
        <button onclick="loadPage('A-A-A')">放 棄</button>
    </div>
</div>

<script>
    (function initEnglishInfo() {
        const c_id = window.currentCustomerId; 
        if(!c_id) {
            alert("系統遺失旅客編號，請重新選擇！");
            loadPage('A-A-A');
            return;
        }
        document.getElementById('e_customer_id').innerText = c_id;

        // 防呆建立資料表
        window.db.exec(`
            CREATE TABLE IF NOT EXISTS CustomerEnglishInfo (
                customer_id TEXT UNIQUE CHECK(length(customer_id) = 7),
                nationality_e TEXT, place_of_birth_e TEXT, occupation_e TEXT, company_name_e TEXT,
                position_e TEXT, name_of_boss_e TEXT, color_of_eyes_e TEXT, hair_e TEXT,
                face_e TEXT, marks_of_iden_e TEXT
            );
        `);

        // 讀取資料庫
        const query = `
            SELECT nationality_e, place_of_birth_e, occupation_e, company_name_e, position_e, 
                   name_of_boss_e, color_of_eyes_e, hair_e, face_e, marks_of_iden_e
            FROM CustomerEnglishInfo WHERE customer_id = '${c_id}'
        `;

        try {
            const res = window.db.exec(query);
            if (res.length > 0) {
                const data = res[0].values[0];
                const cleanStr = (val) => (val === null || val === 'null' || val === undefined) ? '' : val;

                document.getElementById('nationality_e').value = cleanStr(data[0]);
                document.getElementById('place_of_birth_e').value = cleanStr(data[1]);
                document.getElementById('occupation_e').value = cleanStr(data[2]);
                document.getElementById('company_name_e').value = cleanStr(data[3]);
                document.getElementById('position_e').value = cleanStr(data[4]);
                document.getElementById('name_of_boss_e').value = cleanStr(data[5]);
                document.getElementById('color_of_eyes_e').value = cleanStr(data[6]);
                document.getElementById('hair_e').value = cleanStr(data[7]);
                document.getElementById('face_e').value = cleanStr(data[8]);
                document.getElementById('marks_of_iden_e').value = cleanStr(data[9]);
            }
        } catch (e) {
            console.error("讀取旅客英文資料錯誤：", e);
        }
    })();

    // 🟢 日期選擇器功能 (雖無使用，保留供擴充)
    window.openSingleDate = function(prefix) { 
        document.getElementById(`picker_${prefix}`).showPicker(); 
    };

    window.fillSingleDate = function(prefix) {
        const dateValue = document.getElementById(`picker_${prefix}`).value;
        if (dateValue) {
            document.getElementById(prefix).value = dateValue.replace(/-/g, '/');
        }
    };

    // 🟢 儲存資料
    window.saveEnglishInfo = async function() {
        const c_id = window.currentCustomerId; 
        if(!c_id) {
            alert("找不到旅客編號，無法儲存！");
            return;
        }
        
        const nationality_e = document.getElementById('nationality_e').value;
        const place_of_birth_e = document.getElementById('place_of_birth_e').value;
        const occupation_e = document.getElementById('occupation_e').value;
        const company_name_e = document.getElementById('company_name_e').value;
        const position_e = document.getElementById('position_e').value;
        const name_of_boss_e = document.getElementById('name_of_boss_e').value;
        const color_of_eyes_e = document.getElementById('color_of_eyes_e').value;
        const hair_e = document.getElementById('hair_e').value;
        const face_e = document.getElementById('face_e').value;
        const marks_of_iden_e = document.getElementById('marks_of_iden_e').value;

        const sql = `
            REPLACE INTO CustomerEnglishInfo (
                customer_id, nationality_e, place_of_birth_e, occupation_e, company_name_e,
                position_e, name_of_boss_e, color_of_eyes_e, hair_e, face_e, marks_of_iden_e
            ) VALUES (
                '${c_id}', '${nationality_e}', '${place_of_birth_e}', '${occupation_e}', '${company_name_e}',
                '${position_e}', '${name_of_boss_e}', '${color_of_eyes_e}', '${hair_e}', '${face_e}', '${marks_of_iden_e}'
            );
        `;

        const isSuccess = await window.executeAndSave(sql);
        if (isSuccess) alert(`✅ 旅客 [${c_id}] 的「英文資料」已成功更新！`);
    };
</script>
