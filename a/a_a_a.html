<style>
    .search-container {
        padding: 10px;
        background-color: #ece9d8;
        height: 100%;
        box-sizing: border-box;
        font-size: 13px;
    }
    .search-block {
        border: 1px solid #a0a0a0;
        background-color: #d4d0c8;
        margin-bottom: 15px;
    }
    .search-header {
        background: linear-gradient(to right, #808080, #c0c0c0);
        color: white;
        padding: 4px 8px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .search-row {
        display: flex;
        align-items: center;
        padding: 6px 10px;
        border-bottom: 1px solid #fff;
    }
    .search-row:last-child { border-bottom: none; }
    .search-label {
        width: 110px;
        text-align: right;
        margin-right: 10px;
        font-weight: bold;
    }
    .input-box {
        border: 1px inset #fff;
        padding: 2px 4px;
        margin-right: 15px;
    }
    .btn {
        background-color: #ece9d8;
        border: 2px outset #fff;
        padding: 2px 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .btn:active { border-style: inset; }
    .top-right-btn {
        background-color: #ece9d8;
        color: black;
        border: 2px outset #fff;
        padding: 1px 8px;
        cursor: pointer;
    }
</style>

<div class="content-header">
    旅客資料管理首頁
    <button class="top-right-actions top-right-btn" onclick="window.openAddCustomer()">➕ 新增</button>
</div>

<div class="search-container">
    <!-- 快速搜尋區 -->
    <div class="search-block">
        <div class="search-header">➲ 快速搜尋：</div>
        <div class="search-row">
            <span class="search-label">旅客身分證字號：</span>
            <input type="text" class="input-box" style="width: 120px;">
            <span class="search-label" style="width: auto;">旅客中文姓名：</span>
            <input type="text" class="input-box" style="width: 120px;">
            <button class="btn">🔍 搜尋</button>
        </div>
    </div>

    <!-- 進階搜尋區 -->
    <div class="search-block">
        <div class="search-header">➲ 進階搜尋：</div>
        
        <div style="display: flex; padding: 10px;">
            <!-- 左半部 -->
            <div style="flex: 1;">
                <div class="search-row">
                    <span class="search-label">旅客編號：</span>
                    <input type="text" class="input-box" style="width: 120px;">
                </div>
                <div class="search-row">
                    <span class="search-label">旅客姓名關鍵字：</span>
                    <span>中文</span> <input type="text" class="input-box" style="width: 120px;">
                </div>
                <div class="search-row">
                    <span class="search-label"></span>
                    <span>英文姓</span> <input type="text" class="input-box" style="width: 60px;">
                    <span>名</span> <input type="text" class="input-box" style="width: 80px;">
                </div>
                <div class="search-row">
                    <span class="search-label">業務員：</span>
                    <input type="text" class="input-box" style="width: 60px;">
                    <button class="btn" style="padding: 1px 5px; margin-right: 5px;">❓</button>
                    <input type="text" class="input-box" style="width: 80px; background-color: #e0e0e0;" readonly>
                </div>
            </div>
            
            <!-- 右半部 -->
            <div style="flex: 1;">
                <div class="search-row">
                    <span class="search-label">性別：</span>
                    <select class="input-box" style="width: 60px;"><option></option><option>男</option><option>女</option></select>
                </div>
                <div class="search-row">
                    <span class="search-label">通路來源：</span>
                    <select class="input-box" style="width: 150px;"><option>請選擇</option></select>
                </div>
                <div class="search-row" style="justify-content: space-between;">
                    <div style="display: flex; align-items: center;">
                        <span class="search-label">往來狀態：</span>
                        <select class="input-box" style="width: 60px;"><option></option></select>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn">🔍 搜尋</button>
                        <button class="btn">❌ 清除</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 🟢 強制掛載到 window，確保點擊「新增」時一定找得到函數
    window.openAddCustomer = function() {
        // 這會觸發 main.html 中的 loadPage，並去尋找 a/a_a_a_base.html
        loadPage('A-A-A-BASE'); 
    };
</script>
