<style>
    .form-table { width: 100%; border-collapse: collapse; border: 1px solid #777; margin-bottom: 15px; background-color: #fff; }
    .form-table th, .form-table td { border: 1px solid #777; padding: 6px; }
    .form-title { background-color: #ffcc99; font-weight: bold; text-align: center; font-size: 14px; padding: 8px !important; letter-spacing: 2px; }
    .info-header th { background-color: #f0f0f0; width: 100px; text-align: left; padding-left: 10px; }
    .info-header td { color: #333; font-weight: bold; color: blue; }
    .matrix-wrapper th { background-color: #f0f0f0; text-align: center; width: 100px; }
    .matrix-table { width: 100%; border-collapse: collapse; text-align: center; margin: 10px 0; }
    .matrix-table th { background-color: #ccccff; padding: 6px; border: none; border-bottom: 2px solid #fff; border-right: 2px solid #fff; }
    .matrix-table td { background-color: #ffffe0; padding: 6px; border: none; border-bottom: 2px solid #fff; border-right: 2px solid #fff; font-weight: bold;}
    .matrix-table tr.avail-row td { background-color: #ccccff; }
    .input-box { border: 1px inset #fff; padding: 3px; font-size: 13px; width: 40px; text-align: left; font-weight: normal; }
    .subtotal-box { border: 1px inset #fff; padding: 3px; font-size: 13px; width: 40px; text-align: left; background-color: #e0e0e0; font-weight: normal; cursor: default; }
    .action-row { text-align: center; margin-top: 15px; padding: 10px; background-color: #808080; border: 1px solid #777; }
    .action-row button { background-color: #ece9d8; border: 2px outset #fff; padding: 4px 20px; font-weight: bold; letter-spacing: 2px; margin: 0 10px; cursor: pointer; }
    .action-row button:active { border-style: inset; }
</style>

<table class="form-table">
    <tr>
        <td colspan="2" class="form-title">【 編輯艙等機位數 】</td>
    </tr>
    <tr class="info-header">
        <th>團型代碼</th>
        <td id="display_code">載入中...</td>
    </tr>
    <tr class="info-header">
        <th>團型名稱</th>
        <td id="display_name" style="color: black; font-weight: normal;">載入中...</td>
    </tr>
    <tr class="matrix-wrapper">
        <th>機位數</th>
        <td style="padding: 0 20px;">
            <table class="matrix-table">
                <tr>
                    <th style="background-color: transparent;"></th>
                    <th>Y艙</th>
                    <th>ED艙</th>
                    <th>C艙</th>
                    <th>F艙</th>
                    <th style="color: red;">小計</th>
                </tr>
                <!-- 🟢 ID 已對應資料庫欄位改為 _total -->
                <tr>
                    <td>各艙取得機位</td>
                    <td><input type="number" id="y_total" class="input-box" min="0"></td>
                    <td><input type="number" id="ed_total" class="input-box" min="0"></td>
                    <td><input type="number" id="c_total" class="input-box" min="0"></td>
                    <td><input type="number" id="f_total" class="input-box" min="0"></td>
                    <td><input type="text" id="sub_total" class="subtotal-box" readonly></td>
                </tr>
                <tr>
                    <td>領隊保留機位</td>
                    <td><input type="number" id="y_leader" class="input-box" min="0"></td>
                    <td><input type="number" id="ed_leader" class="input-box" min="0"></td>
                    <td><input type="number" id="c_leader" class="input-box" min="0"></td>
                    <td><input type="number" id="f_leader" class="input-box" min="0"></td>
                    <td><input type="text" id="sub_leader" class="subtotal-box" readonly></td>
                </tr>
                <tr>
                    <td>導遊保留機位</td>
                    <td><input type="number" id="y_guide" class="input-box" min="0"></td>
                    <td><input type="number" id="ed_guide" class="input-box" min="0"></td>
                    <td><input type="number" id="c_guide" class="input-box" min="0"></td>
                    <td><input type="number" id="f_guide" class="input-box" min="0"></td>
                    <td><input type="text" id="sub_guide" class="subtotal-box" readonly></td>
                </tr>
                <tr>
                    <td>其他保留機位</td>
                    <td><input type="number" id="y_other" class="input-box" min="0"></td>
                    <td><input type="number" id="ed_other" class="input-box" min="0"></td>
                    <td><input type="number" id="c_other" class="input-box" min="0"></td>
                    <td><input type="number" id="f_other" class="input-box" min="0"></td>
                    <td><input type="text" id="sub_other" class="subtotal-box" readonly></td>
                </tr>
                <tr>
                    <td>自由行保留機位</td>
                    <td><input type="number" id="y_fit" class="input-box" min="0"></td>
                    <td><input type="number" id="ed_fit" class="input-box" min="0"></td>
                    <td><input type="number" id="c_fit" class="input-box" min="0"></td>
                    <td><input type="number" id="f_fit" class="input-box" min="0"></td>
                    <td><input type="text" id="sub_fit" class="subtotal-box" readonly></td>
                </tr>
                <tr class="avail-row">
                    <td>各艙可售機位</td>
                    <td id="y_avail">0</td>
                    <td id="ed_avail">0</td>
                    <td id="c_avail">0</td>
                    <td id="f_avail">0</td>
                    <td></td>
                </tr>
            </table>
        </td>
    </tr>
</table>

<div class="action-row">
    <button onclick="window.saveCabinSeats()">確 定</button>
    <button onclick="window.resetForm()">重 填</button>
    <button onclick="loadPage('C-A-B')">放 棄</button>
</div>

<script>
    // 🟢 運算核心對應為 'total'
    window.calcSeats = function() {
        const types = ['y', 'ed', 'c', 'f'];
        const rows = ['total', 'leader', 'guide', 'other', 'fit'];

        // 1. 計算小計
        rows.forEach(r => {
            let sum = 0;
            types.forEach(t => {
                let el = document.getElementById(`${t}_${r}`);
                let val = el ? (parseInt(el.value) || 0) : 0;
                sum += val;
            });
            let subEl = document.getElementById(`sub_${r}`);
            if (subEl) subEl.value = sum;
        });

        // 2. 計算可售機位 (總數 - 領隊 - 導遊 - 其他 - 自由行)
        types.forEach(t => {
            let totalVal = parseInt(document.getElementById(`${t}_total`)?.value) || 0;
            let leaderVal = parseInt(document.getElementById(`${t}_leader`)?.value) || 0;
            let guideVal = parseInt(document.getElementById(`${t}_guide`)?.value) || 0;
            let otherVal = parseInt(document.getElementById(`${t}_other`)?.value) || 0;
            let fitVal = parseInt(document.getElementById(`${t}_fit`)?.value) || 0;

            let avail = totalVal - leaderVal - guideVal - otherVal - fitVal;
            let availEl = document.getElementById(`${t}_avail`);
            if (availEl) availEl.innerText = avail;
        });
    };

    (function initCabinSeats() {
        const tCode = window.currentEditTourCode;
        const tName = window.currentEditTourName;
        
        if (!tCode) {
            alert("系統遺失團型代碼，請重新選擇！");
            loadPage('C-A-B');
            return;
        }

        document.getElementById('display_code').innerText = tCode;
        document.getElementById('display_name').innerText = tName || '';

        // 動態綁定即時運算事件
        const inputs = document.querySelectorAll('input[type="number"].input-box');
        inputs.forEach(input => {
            input.addEventListener('input', window.calcSeats);
            input.addEventListener('change', window.calcSeats);
        });

        if (!window.db) return;

        // 🟢 使用您提供的 SQL Create Table 結構
        window.db.exec(`
            CREATE TABLE IF NOT EXISTS TourCabinSeats (
                tour_code TEXT PRIMARY KEY,
                y_total INTEGER DEFAULT 0, y_leader INTEGER DEFAULT 0, y_guide INTEGER DEFAULT 0, y_other INTEGER DEFAULT 0, y_fit INTEGER DEFAULT 0,
                ed_total INTEGER DEFAULT 0, ed_leader INTEGER DEFAULT 0, ed_guide INTEGER DEFAULT 0, ed_other INTEGER DEFAULT 0, ed_fit INTEGER DEFAULT 0,
                c_total INTEGER DEFAULT 0, c_leader INTEGER DEFAULT 0, c_guide INTEGER DEFAULT 0, c_other INTEGER DEFAULT 0, c_fit INTEGER DEFAULT 0,
                f_total INTEGER DEFAULT 0, f_leader INTEGER DEFAULT 0, f_guide INTEGER DEFAULT 0, f_other INTEGER DEFAULT 0, f_fit INTEGER DEFAULT 0
            );
        `);

        try {
            const res = window.db.exec(`SELECT * FROM TourCabinSeats WHERE tour_code = '${tCode}'`);
            if (res.length > 0) {
                const data = res[0].values[0];
                // 🟢 載入資料時的陣列對應為 'total'
                ['y', 'ed', 'c', 'f'].forEach((t, typeIdx) => {
                    ['total', 'leader', 'guide', 'other', 'fit'].forEach((r, rowIdx) => {
                        const val = data[1 + typeIdx * 5 + rowIdx];
                        let el = document.getElementById(`${t}_${r}`);
                        if(el) el.value = val === 0 ? '' : val;
                    });
                });
            }
        } catch (e) { console.error("載入機位資料失敗", e); }
        
        // 載入完畢後主動計算一次
        window.calcSeats();
    })();

    window.resetForm = function() {
        document.querySelectorAll('input[type="number"].input-box').forEach(input => input.value = '');
        window.calcSeats();
    };

    window.saveCabinSeats = async function() {
        const tCode = window.currentEditTourCode;
        if (!tCode) return;
        
        const getVal = (id) => {
            const el = document.getElementById(id);
            return el ? (parseInt(el.value) || 0) : 0;
        };
        
        // 🟢 儲存時的 SQL 指令也完整對應您的 _total 架構
        const sql = `
            REPLACE INTO TourCabinSeats (
                tour_code,
                y_total, y_leader, y_guide, y_other, y_fit,
                ed_total, ed_leader, ed_guide, ed_other, ed_fit,
                c_total, c_leader, c_guide, c_other, c_fit,
                f_total, f_leader, f_guide, f_other, f_fit
            ) VALUES (
                '${tCode}',
                ${getVal('y_total')}, ${getVal('y_leader')}, ${getVal('y_guide')}, ${getVal('y_other')}, ${getVal('y_fit')},
                ${getVal('ed_total')}, ${getVal('ed_leader')}, ${getVal('ed_guide')}, ${getVal('ed_other')}, ${getVal('ed_fit')},
                ${getVal('c_total')}, ${getVal('c_leader')}, ${getVal('c_guide')}, ${getVal('c_other')}, ${getVal('c_fit')},
                ${getVal('f_total')}, ${getVal('f_leader')}, ${getVal('f_guide')}, ${getVal('f_other')}, ${getVal('f_fit')}
            );
        `;

        if (window.executeAndSave) {
            const isSuccess = await window.executeAndSave(sql);
            if (isSuccess) alert("機位資料已成功儲存！");
        } else if (window.db) {
            window.db.exec(sql);
            alert("機位資料已成功儲存！");
        }
    };
</script>
